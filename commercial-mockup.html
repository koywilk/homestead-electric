<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Commercial Mode — Mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
  /* ── App tokens (mirrors const C / const D in App.js) ── */
  :root{
    --bg:#EEF0F3; --surface:#F4F6F8; --card:#FFFFFF; --border:#E1E4E9;
    --muted:#CDD3DB; --text:#1B1F24; --dim:#5E6670; --accent:#3B5BA5;
    --blue:#3B5BA5; --green:#3E7D5A; --red:#B23A3A; --purple:#6A5E97;
    --orange:#B06A2C; --teal:#3E7D7A; --amber:#B0892C; --done:#46916A;
    --d-bg1:#141821; --d-bg2:#1B2030; --d-hair:#2A2F3A;
    --d-text:#9AA3B2; --d-bright:#E6EAF1; --d-chipbg:#222732; --d-chipline:#2E3440;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0; background:var(--bg); color:var(--text); font-family:'DM Sans',-apple-system,sans-serif; font-size:14px;}
  .bebas{font-family:'Bebas Neue',sans-serif;}

  /* ── Command header ── */
  .cmdbar{background:linear-gradient(180deg,var(--d-bg1),var(--d-bg2)); border-bottom:1px solid var(--d-hair); padding:10px 18px 12px; position:sticky; top:0; z-index:5;}
  body.comm .cmdbar{border-bottom:2px solid var(--teal);}
  .brandrow{display:flex; align-items:center; gap:12px; flex-wrap:wrap;}
  .brand{font-family:'Bebas Neue',sans-serif; font-size:19px; letter-spacing:0.1em; color:var(--d-bright); display:flex; align-items:center; gap:10px;}
  .brand .mock{font-family:'DM Sans'; font-size:9px; font-weight:700; letter-spacing:0.08em; background:var(--purple); color:#fff; border-radius:99px; padding:2px 8px;}
  .brand .div{font-family:'DM Sans'; font-size:9px; font-weight:800; letter-spacing:0.1em; background:var(--teal); color:#fff; border-radius:4px; padding:2px 7px; display:none;}
  body.comm .brand .div{display:inline-block;}
  .modeswitch{display:flex; border:1px solid var(--d-chipline); border-radius:99px; overflow:hidden; background:var(--d-chipbg); margin-left:auto;}
  .modeswitch button{border:0; background:transparent; color:var(--d-text); font:700 10px 'DM Sans'; letter-spacing:0.1em; padding:6px 12px; cursor:pointer;}
  .modeswitch button.on{background:var(--accent); color:#fff;}
  body.comm .modeswitch button.on{background:var(--teal);}
  .tabs{display:flex; gap:6px; margin-top:8px; overflow-x:auto; scrollbar-width:none;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab{padding:7px 16px; font-size:12px; font-weight:500; color:#9AA3B2; border-radius:8px; letter-spacing:0.02em; white-space:nowrap; cursor:pointer; transition:all 0.15s;}
  .tab.on{background:var(--accent); color:#fff; font-weight:700; box-shadow:0 6px 18px rgba(59,91,165,.5);}
  body.comm .tab.on{background:var(--teal); box-shadow:0 6px 18px rgba(62,125,122,.5);}

  .wrap{padding:16px 18px 80px; max-width:1120px; margin:0 auto;}
  .note{background:#fff; border:1px dashed var(--muted); border-radius:10px; padding:10px 14px; font-size:12px; color:var(--dim); margin-bottom:14px;}
  .note b{color:var(--text);}

  .pagehead{display:flex; align-items:flex-start; justify-content:space-between; flex-wrap:wrap; gap:12px; margin-bottom:14px;}
  .pagehead h1{font-family:'Bebas Neue',sans-serif; font-size:28px; letter-spacing:0.06em; color:var(--text); line-height:1; margin:0; font-weight:400;}
  .subcounts{font-size:12px; color:var(--dim); margin-top:4px;}
  .subcounts b{font-weight:700;}
  .controls{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .controls input[type=text]{padding:6px 10px; border-radius:7px; border:1px solid var(--border); font-size:12px; background:#fff; color:var(--text); font-family:inherit; outline:none; min-width:220px;}
  .btn{padding:6px 12px; border-radius:7px; font-size:12px; border:1px solid var(--border); background:#fff; color:var(--dim); cursor:pointer; font-family:inherit; font-weight:600;}
  .btn.on{background:var(--accent); color:#fff; border-color:var(--accent);}
  .btn.teal{background:var(--teal); color:#fff; border-color:var(--teal);}
  .btn.amber{border-color:var(--amber); color:var(--amber); background:#fff;}
  .btn.amber:hover{background:#B0892C12;}

  /* ── Stage sections (Job Board) ── */
  .stage{margin-bottom:18px;}
  .stagehead{display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:2px solid var(--border); margin-bottom:10px; cursor:pointer;}
  .stagehead .t{font-family:'Bebas Neue',sans-serif; font-size:17px; letter-spacing:0.08em;}
  .stagehead .n{font-size:11px; font-weight:700; color:var(--dim); background:var(--surface); border:1px solid var(--border); border-radius:99px; padding:1px 8px;}
  .stagehead .caret{margin-left:auto; color:var(--dim); font-size:11px;}
  .stage.collapsed .rows{display:none;}

  .row{background:var(--card); border:1px solid var(--border); border-radius:10px; padding:12px 14px; margin-bottom:8px; box-shadow:0 4px 16px rgba(15,31,61,0.08); display:flex; align-items:center; gap:14px; flex-wrap:wrap;}
  .row.needs{border-left:3px solid var(--red);}
  .row.ok{border-left:3px solid var(--done);}
  .row.overridden{border-left:3px solid var(--amber);}
  .jobinfo{min-width:200px; flex:1 1 200px;}
  .jobname{font-weight:700; font-size:14px; color:var(--text); cursor:pointer;}
  .jobname:hover{color:var(--accent); text-decoration:underline;}
  .jobmeta{display:flex; align-items:center; gap:8px; margin-top:3px; font-size:11px; color:var(--dim); flex-wrap:wrap;}
  .fdot{width:7px; height:7px; border-radius:99px; display:inline-block; margin-right:4px;}
  .pill{border-radius:99px; padding:2px 10px; font-size:10px; font-weight:700; white-space:nowrap; letter-spacing:0.05em; border:1px solid transparent;}
  .pill.grey{background:#5E667015; color:var(--dim); border-color:#5E667040;}
  .pill.blue{background:#3B5BA515; color:var(--blue); border-color:#3B5BA540;}
  .pill.teal{background:#3E7D7A15; color:var(--teal); border-color:#3E7D7A40;}
  .pill.green{background:#3E7D5A15; color:var(--green); border-color:#3E7D5A40;}
  .pill.red{background:#B23A3A15; color:var(--red); border-color:#B23A3A40;}
  .pill.amber{background:#B0892C15; color:var(--amber); border-color:#B0892C40;}
  .pill.purple{background:#6A5E9715; color:var(--purple); border-color:#6A5E9740;}
  .pill.gc{background:var(--surface); color:var(--dim); border-color:var(--border); letter-spacing:0;}

  /* ── Lanes (Job Prep) ── */
  .lane{margin-bottom:26px;}
  .lanehead{display:flex; align-items:center; gap:10px; margin-bottom:12px; padding-bottom:8px; flex-wrap:wrap; cursor:pointer;}
  .lanehead .t{font-family:'Bebas Neue',sans-serif; font-size:18px; letter-spacing:0.08em;}
  .lane.admin .lanehead{border-bottom:2px solid #3B5BA522;} .lane.admin .t{color:var(--blue);}
  .lane.prep .lanehead{border-bottom:2px solid #3E7D7A22;} .lane.prep .t{color:var(--teal);}
  .lanehead .who{margin-left:auto; font-size:10px; font-weight:700; letter-spacing:0.06em; color:var(--dim); text-transform:uppercase;}
  .lane.collapsed .lanebody{display:none;}

  .chips{display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
  .chip{display:inline-flex; align-items:center; gap:6px; border-radius:99px; font-size:10px; font-weight:700; letter-spacing:0.05em; cursor:pointer; user-select:none; border:1px solid var(--red); color:var(--red); background:#fff; min-height:30px; padding:0 11px;}
  .chip.done{border-color:var(--done); color:var(--done); background:#46916A0F;}
  .chip.na{border-color:var(--muted); color:var(--dim); border-style:dashed; background:var(--surface);}
  .chip .g{font-size:11px;}
  .prog{font-size:11px; color:var(--dim); font-weight:600; white-space:nowrap;}
  .prog b{color:var(--text);}
  .next{font-size:11px; color:var(--orange); font-weight:600;}
  .ovnote{font-size:11px; color:var(--amber); font-weight:600; width:100%;}
  .strip{border:1px dashed var(--done); border-radius:10px; padding:10px 14px; font-size:12px; color:var(--green); font-weight:600; background:#46916A08; cursor:pointer;}

  /* ── Job drawer ── */
  .overlay{position:fixed; inset:0; background:rgba(20,24,33,.45); display:none; z-index:20;}
  .overlay.open{display:block;}
  .drawer{position:fixed; top:0; right:0; bottom:0; width:min(760px,100%); background:var(--bg); z-index:21; transform:translateX(100%); transition:transform .2s; overflow:auto; box-shadow:-12px 0 40px rgba(0,0,0,.25);}
  .drawer.open{transform:none;}
  .dhead{background:linear-gradient(180deg,var(--d-bg1),var(--d-bg2)); color:var(--d-bright); padding:14px 18px 10px; position:sticky; top:0; z-index:2;}
  .dhead .name{font-family:'Bebas Neue',sans-serif; font-size:24px; letter-spacing:0.05em; display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .dhead .x{margin-left:auto; font:600 12px 'DM Sans'; color:var(--d-text); cursor:pointer; padding:4px 8px;}
  .dhead .sub{font-size:11px; color:var(--d-text); margin-top:2px;}
  .dtabs{display:flex; gap:4px; margin-top:10px; overflow-x:auto; scrollbar-width:none;}
  .dtabs::-webkit-scrollbar{display:none;}
  .dtab{padding:6px 12px; font-size:11px; font-weight:600; color:var(--d-text); border-radius:7px; white-space:nowrap; cursor:pointer;}
  .dtab.on{background:var(--teal); color:#fff;}
  .dbody{padding:16px 18px 60px;}
  .card{background:var(--card); border:1px solid var(--border); border-radius:10px; padding:14px 16px; margin-bottom:12px; box-shadow:0 4px 16px rgba(15,31,61,0.06);}
  .card h3{font-family:'Bebas Neue',sans-serif; font-size:16px; letter-spacing:0.08em; margin:0 0 10px; color:var(--dim); font-weight:400;}
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:10px 14px;}
  .f label{display:block; font-size:9px; font-weight:800; letter-spacing:0.1em; color:var(--dim); text-transform:uppercase; margin-bottom:3px;}
  .f input{width:100%; padding:7px 9px; border:1px solid var(--border); border-radius:7px; font:500 13px 'DM Sans'; color:var(--text); background:#fff;}
  .seg{display:inline-flex; border:1px solid var(--border); border-radius:8px; overflow:hidden;}
  .seg button{border:0; background:#fff; color:var(--dim); font:700 11px 'DM Sans'; letter-spacing:0.05em; padding:7px 12px; cursor:pointer;}
  .seg button.on{background:var(--teal); color:#fff;}
  .seg.stage button.on{background:var(--blue);}
  .hint{font-size:11px; color:var(--dim); margin-top:6px;}
  .empty{font-size:12px; color:var(--dim); padding:18px; text-align:center; border:1px dashed var(--muted); border-radius:10px;}

  /* ── Modal ── */
  .modal{position:fixed; inset:0; background:rgba(20,24,33,.55); display:none; align-items:center; justify-content:center; z-index:30; padding:16px;}
  .modal.open{display:flex;}
  .mbox{background:#fff; border-radius:12px; width:min(460px,100%); padding:18px 20px; box-shadow:0 20px 60px rgba(0,0,0,.35);}
  .mbox h2{font-family:'Bebas Neue',sans-serif; font-size:22px; letter-spacing:0.06em; margin:0 0 6px; font-weight:400;}
  .mbox p{font-size:13px; color:var(--dim); margin:0 0 10px;}
  .mbox ul{margin:0 0 12px 18px; padding:0; font-size:13px;}
  .mbox textarea{width:100%; border:1px solid var(--border); border-radius:7px; padding:8px; font:13px 'DM Sans'; min-height:60px; margin-bottom:12px;}
  .mrow{display:flex; gap:8px; justify-content:flex-end;}
  .toast{position:fixed; left:50%; bottom:22px; transform:translateX(-50%); background:var(--d-bg1); color:var(--d-bright); font-size:12px; font-weight:600; padding:9px 14px; border-radius:99px; opacity:0; transition:opacity .2s; pointer-events:none; z-index:40;}
  .toast.show{opacity:1;}
  @media (max-width:520px){ .wrap{padding:12px 12px 80px;} .row{padding:10px 12px;} .modeswitch{margin-left:0;} }
</style>
</head>
<body class="comm">

<div class="cmdbar">
  <div class="brandrow">
    <div class="brand">HOMESTEAD ELECTRIC <span class="div">COMMERCIAL</span> <span class="mock">MOCKUP</span></div>
    <div class="modeswitch" id="modeswitch">
      <button data-mode="resi">RESI</button>
      <button data-mode="comm" class="on">COMMERCIAL</button>
    </div>
  </div>
  <div class="tabs" id="tabs"></div>
</div>

<div class="wrap" id="page"></div>

<!-- Job drawer -->
<div class="overlay" id="overlay"></div>
<div class="drawer" id="drawer"></div>

<!-- Override modal -->
<div class="modal" id="modal">
  <div class="mbox">
    <h2>Mobilize without full pre-con?</h2>
    <p>These items stay red on the Pre-Con board with an OVERRIDE badge until they're actually checked off. Nothing gets forgotten. Undo any time.</p>
    <ul id="modalItems"></ul>
    <textarea placeholder="Note (optional) — e.g. gear submittal still with the engineer, GC needs us on underground Monday"></textarea>
    <div class="mrow"><button class="btn" id="modalCancel">Cancel</button><button class="btn amber" id="modalOk">Mark Cleared to Mobilize</button></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ───────────────────────── fake data ───────────────────────── */
const PEOPLE = { Gage:"#3B5BA5", Owen:"#6A5E97", Braden:"#3E7D7A", Nelson:"#B06A2C", Koy:"#3E7D5A" };

const ADMIN_ITEMS = [
  ["jobAccount","ACCOUNT"],["preLien","PRELIM NOTICE"],["coi","COI SENT"],["subcontract","CONTRACT"],
  ["sov","SOV"],["billingSetup","BILLING"],["permit","PERMIT"]];
const PRECON_ITEMS = [
  ["plansCurrent","PLANS + SPECS"],["submittalsSent","SUBMITTALS SENT"],["submittalsApproved","SUBMITTALS OK"],
  ["longLeadOrdered","LONG-LEAD ORDERED"],["gcSchedule","GC SCHEDULE"],["kickoff","KICKOFF"],
  ["siteLogistics","SITE LOGISTICS"],["foremanHandoff","HAND-OFF"]];

// division absent = resi (the real rule). Only commercial jobs carry `commercial`.
const JOBS = [
  { id:"c1", division:"commercial", name:"Ridgeline Dental — TI Suite 210", gc:"Layton Construction", foreman:"Gage", simpro:"1892", projectNo:"LC-24-0311",
    gcPm:"Dana Whitfield", gcSuper:"Mike Torres", contractValue:"$184,500", permitNo:"", planSetRev:"Rev 2 (9/12)", mobilize:"10/6/2026",
    commercial:{ stage:"", prep:{plansCurrent:true,gcSchedule:true,kickoff:true}, prepNA:{}, admin:{jobAccount:true,preLien:true,coi:true,subcontract:true}, adminNA:{}, prepOverride:null } },
  { id:"c2", division:"commercial", name:"Summit Storage — Bldg B & C", gc:"Big-D Construction", foreman:"Braden", simpro:"1874", projectNo:"BD-7781",
    gcPm:"Chris Lam", gcSuper:"Andy Ruiz", contractValue:"$412,000", permitNo:"E-26-04412", planSetRev:"IFC 8/2", mobilize:"9/8/2026",
    commercial:{ stage:"inprogress", prep:{plansCurrent:true,submittalsSent:true,submittalsApproved:true,longLeadOrdered:true,gcSchedule:true,kickoff:true,siteLogistics:true,foremanHandoff:true}, prepNA:{}, admin:{jobAccount:true,preLien:true,coi:true,subcontract:true,sov:true,billingSetup:true,permit:true}, adminNA:{}, prepOverride:null } },
  { id:"c3", division:"commercial", name:"Wasatch Credit Union — Branch Remodel", gc:"Jacobsen", foreman:"Owen", simpro:"1901", projectNo:"JC-2609",
    gcPm:"Sara Kim", gcSuper:"Tom Bell", contractValue:"$96,200", permitNo:"E-26-05120", planSetRev:"Rev 1", mobilize:"9/22/2026",
    commercial:{ stage:"", prep:{plansCurrent:true,submittalsSent:true,gcSchedule:true,kickoff:true,siteLogistics:true,foremanHandoff:true}, prepNA:{longLeadOrdered:true}, admin:{jobAccount:true,preLien:true,coi:true,subcontract:true,permit:true}, adminNA:{sov:true,billingSetup:true},
      prepOverride:{on:true,by:"Koy",at:"9/19/2026",note:"Fixture submittal still with engineer; GC needs demo + rough Monday"} } },
  { id:"c4", division:"commercial", name:"Herriman Fire Station 103 — Gear Replacement", gc:"Hogan", foreman:"Nelson", simpro:"1866", projectNo:"HG-1150",
    gcPm:"Ben Ortiz", gcSuper:"Ben Ortiz", contractValue:"$238,000", permitNo:"E-26-03980", planSetRev:"IFC", mobilize:"7/14/2026",
    commercial:{ stage:"closeout", prep:{plansCurrent:true,submittalsSent:true,submittalsApproved:true,longLeadOrdered:true,gcSchedule:true,kickoff:true,siteLogistics:true,foremanHandoff:true}, prepNA:{}, admin:{jobAccount:true,preLien:true,coi:true,subcontract:true,sov:true,billingSetup:true,permit:true}, adminNA:{}, prepOverride:null } },
  // residential — no `division`, no `commercial`
  { id:"r1", name:"Bukhshtaber", gc:"Split Rock Custom Homes", foreman:"Gage", simpro:"1840", resiStage:"Rough In Progress" },
  { id:"r2", name:"Larsen Residence", gc:"Alpine Homes", foreman:"Owen", simpro:"1855", resiStage:"Pre Job Prep" },
  { id:"r3", name:"Kimball — Lot 14", gc:"Ivory Homes", foreman:"Braden", simpro:"1861", resiStage:"Finish In Progress" },
];
const jobDivision = j => j.division === "commercial" ? "commercial" : "resi";

/* ───────────────────────── app state ───────────────────────── */
let mode = "comm";
let view = "home";
let openJob = null, openTab = "Job Info";
const collapsed = { stageComplete:true, laneAdmin:false, lanePrep:false };

const NAV = {
  comm: [["myday","My Day"],["home","Job Board"],["needs","Needs"],["cos","COs"],["commprep","Pre-Con"],["contractors","Contractors"],["safety","Safety"],["schedule","Forecast"],["settings","Settings"]],
  resi: [["myday","My Day"],["home","Job Board"],["today","Today"],["needs","Needs"],["cos","COs"],["jobprep","Job Prep"],["contractors","Contractors"],["safety","Safety"],["schedule","Forecast"],["huddle","Huddle"],["scoreboard","Scoreboard"],["qc","QC"],["settings","Settings"]],
};

/* ───────────────────────── derived rules (mirror the spec) ───────────────────────── */
const precon = j => j.commercial || {};
const itemState = (map, na, k) => map[k] ? "done" : na[k] ? "na" : "todo";
const laneDone = (items, map, na) => items.every(([k]) => map[k] || na[k]);
const commPrepChecked = j => laneDone(PRECON_ITEMS, precon(j).prep||{}, precon(j).prepNA||{});
const commCleared = j => commPrepChecked(j) || !!(precon(j).prepOverride && precon(j).prepOverride.on);
const commStageOf = j => {
  if (!commCleared(j)) return "precon";
  const s = precon(j).stage || "";
  return s === "" || s === "mobilized" ? "mobilizing" : s;
};
const STAGES = [
  ["precon","Pre-Con","teal"],["mobilizing","Mobilizing","grey"],["inprogress","In Progress","blue"],
  ["hold","On Hold","amber"],["closeout","Closeout","purple"],["complete","Complete","green"]];

/* ───────────────────────── render ───────────────────────── */
const $ = s => document.querySelector(s);
const toast = (m) => { const t=$("#toast"); t.textContent=m; t.classList.add("show"); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"),1800); };
const fdot = f => `<span class="fdot" style="background:${PEOPLE[f]||'#999'}"></span>${f}`;

function renderTabs(){
  $("#tabs").innerHTML = NAV[mode].map(([k,l]) => `<div class="tab ${view===k?'on':''}" data-view="${k}">${l}</div>`).join("");
  document.querySelectorAll("#tabs .tab").forEach(t => t.onclick = () => { view = t.dataset.view; render(); });
  document.querySelectorAll("#modeswitch button").forEach(b => b.classList.toggle("on", b.dataset.mode===mode));
  document.body.classList.toggle("comm", mode==="comm");
}

function render(){
  renderTabs();
  const jobs = JOBS.filter(j => jobDivision(j) === (mode==="comm" ? "commercial" : "resi"));   // THE filter
  const p = $("#page");
  if (mode === "resi") {
    if (view === "home") p.innerHTML = resiBoard(jobs); else p.innerHTML = `<div class="empty">Residential ${labelOf(view)} — unchanged from today. Commercial jobs never appear here.</div>`;
    return;
  }
  if (view === "home") p.innerHTML = commBoard(jobs);
  else if (view === "commprep") p.innerHTML = commPrep(jobs);
  else p.innerHTML = `<div class="empty">${labelOf(view)} in Commercial mode = the same screen you know, showing only the ${jobs.length} commercial jobs (Needs and My Day follow the job they're attached to).</div>`;
  wire();
}
const labelOf = k => (NAV.comm.concat(NAV.resi).find(([x])=>x===k)||[k,k])[1];

function resiBoard(jobs){
  return `<div class="note"><b>Residential mode</b> — exactly today's Job Board. The 4 commercial jobs are filtered out at the top of the app, so no residential screen, chase, or count ever sees them.</div>
  <div class="pagehead"><div><h1>JOB BOARD</h1><div class="subcounts"><b>${jobs.length}</b> residential jobs</div></div></div>
  ${jobs.map(j => `<div class="row"><div class="jobinfo"><div class="jobname">${j.name}</div><div class="jobmeta">${fdot(j.foreman)} · Simpro #${j.simpro} · <span class="pill gc">${j.gc}</span></div></div><span class="pill blue">${j.resiStage.toUpperCase()}</span></div>`).join("")}`;
}

function commBoard(jobs){
  const groups = STAGES.map(([k,l,c]) => [k,l,c, jobs.filter(j => commStageOf(j)===k)]);
  return `<div class="note"><b>Commercial Job Board</b> — grouped by the commercial stages (no Rough / Finish). Tap a job name to open its card. Tap a stage header to collapse it.</div>
  <div class="pagehead"><div><h1>JOB BOARD</h1><div class="subcounts"><b>${jobs.length}</b> commercial jobs · <b>${jobs.filter(j=>!commCleared(j)).length}</b> in pre-con · <b>${jobs.filter(j=>commStageOf(j)==="inprogress").length}</b> in progress</div></div>
  <div class="controls"><input type="text" placeholder="Search jobs, GC, project #…"/><button class="btn">Flagged</button><button class="btn teal">+ New Job</button></div></div>
  ${groups.map(([k,l,c,rows]) => `<div class="stage ${k==="complete"&&collapsed.stageComplete?'collapsed':''}" data-stage="${k}">
     <div class="stagehead"><span class="t" style="color:var(--${c==='grey'?'dim':c})">${l.toUpperCase()}</span><span class="n">${rows.length}</span><span class="caret">▾</span></div>
     <div class="rows">${rows.length ? rows.map(j => boardRow(j)).join("") : `<div class="empty">No jobs in ${l}</div>`}</div></div>`).join("")}`;
}
function boardRow(j){
  const c = precon(j); const held = !commCleared(j); const ov = c.prepOverride && c.prepOverride.on && !commPrepChecked(j);
  const done = PRECON_ITEMS.filter(([k]) => c.prep[k]||c.prepNA[k]).length;
  return `<div class="row ${held?'needs':ov?'overridden':''}"><div class="jobinfo"><div class="jobname" data-open="${j.id}">${j.name}</div>
    <div class="jobmeta">${fdot(j.foreman)} · Simpro #${j.simpro} · Proj ${j.projectNo} · <span class="pill gc">${j.gc}</span> · Super: ${j.gcSuper}</div></div>
    ${held ? `<span class="prog">Pre-con <b>${done}/${PRECON_ITEMS.length}</b></span><span class="pill teal">MOBILIZE ${j.mobilize}</span>` : ""}
    ${ov ? `<span class="pill amber">OVERRIDE · ${PRECON_ITEMS.length-done} OWED</span>` : ""}
    ${commStageOf(j)==="inprogress" ? `<span class="pill blue">IN PROGRESS</span>` : ""}
    ${commStageOf(j)==="closeout" ? `<span class="pill purple">CLOSEOUT</span>` : ""}
  </div>`;
}

function chip(j, lane, k, label){
  const c = precon(j); const map = lane==="admin"?c.admin:c.prep; const na = lane==="admin"?c.adminNA:c.prepNA;
  const st = itemState(map, na, k);
  const g = st==="done"?"✓":st==="na"?"—":"○";
  return `<span class="chip ${st}" data-chip="${j.id}|${lane}|${k}" title="tap: toggle · long-press / ▾: Not needed"><span class="g">${g}</span>${label}${st==="na"?" · N/A":""}</span>`;
}
function commPrep(jobs){
  const live = jobs.filter(j => commStageOf(j)!=="complete");
  const held = live.filter(j=>!commCleared(j)).length, onOv = live.filter(j=>precon(j).prepOverride&&precon(j).prepOverride.on&&!commPrepChecked(j)).length;
  const adminOpen = live.filter(j => !laneDone(ADMIN_ITEMS, precon(j).admin, precon(j).adminNA));
  const adminDone = live.filter(j =>  laneDone(ADMIN_ITEMS, precon(j).admin, precon(j).adminNA));
  const prepOpen  = live.filter(j => !commPrepChecked(j));
  const prepDone  = live.filter(j =>  commPrepChecked(j));
  return `<div class="note"><b>Pre-Con board</b> — the commercial Job Prep. Same mechanics as the residential tab (chips, N/A, two lanes, override with audit stamp); different items. Tap a chip to cycle ○ → ✓ → N/A. Lane 2 gates the job; lane 1 is tracked.</div>
  <div class="pagehead"><div><h1>PRE-CON</h1><div class="subcounts"><b>${live.length}</b> active · <b style="color:var(--red)">${held}</b> held in pre-con · <b style="color:var(--amber)">${onOv}</b> mobilized on override · <b style="color:var(--green)">${live.length-held}</b> cleared to mobilize</div></div>
  <div class="controls"><input type="text" placeholder="Search…"/><button class="btn">Show complete</button></div></div>

  <div class="lane admin ${collapsed.laneAdmin?'collapsed':''}" data-lane="laneAdmin"><div class="lanehead"><span class="t">OFFICE ADMIN</span><span class="pill blue">${adminOpen.length} open</span><span class="who">Justin's lane</span></div>
   <div class="lanebody">${adminOpen.map(j => `<div class="row needs"><div class="jobinfo"><div class="jobname" data-open="${j.id}">${j.name}</div><div class="jobmeta">${fdot(j.foreman)} · ${j.gc} · mobilize ${j.mobilize}</div></div>
      <div class="chips">${ADMIN_ITEMS.map(([k,l])=>chip(j,"admin",k,l)).join("")}</div></div>`).join("")}
     ${adminDone.length?`<div class="strip">✓ ${adminDone.length} job${adminDone.length>1?'s':''} complete — ${adminDone.map(j=>j.name.split(" — ")[0]).join(", ")}</div>`:""}</div></div>

  <div class="lane prep ${collapsed.lanePrep?'collapsed':''}" data-lane="lanePrep"><div class="lanehead"><span class="t">PRE-CON CHECKLIST</span><span class="pill teal">${prepOpen.length} open</span><span class="who">Koy's lane</span></div>
   <div class="lanebody">${prepOpen.map(j => { const c=precon(j); const ov=c.prepOverride&&c.prepOverride.on; const done=PRECON_ITEMS.filter(([k])=>c.prep[k]||c.prepNA[k]).length; const nxt=PRECON_ITEMS.find(([k])=>!c.prep[k]&&!c.prepNA[k]);
      return `<div class="row ${ov?'overridden':'needs'}"><div class="jobinfo"><div class="jobname" data-open="${j.id}">${j.name}</div><div class="jobmeta">${fdot(j.foreman)} · ${j.gc} · <span class="pill teal">MOBILIZE ${j.mobilize}</span> ${ov?`<span class="pill amber">OVERRIDE · ${c.prepOverride.by} ${c.prepOverride.at}</span>`:""}</div></div>
        <div class="chips">${PRECON_ITEMS.map(([k,l])=>chip(j,"prep",k,l)).join("")}</div>
        <span class="prog"><b>${done}/${PRECON_ITEMS.length}</b></span>${nxt?`<span class="next">NEXT: ${nxt[1]}</span>`:""}
        ${ov ? `<div class="ovnote">${c.prepOverride.note||""} <button class="btn" data-undo="${j.id}" style="margin-left:8px">↩ Undo override</button></div>` : `<button class="btn amber" data-override="${j.id}">MOBILIZE WITHOUT FULL PREP</button>`}
      </div>`; }).join("")}
     ${prepDone.length?`<div class="strip">✓ ${prepDone.length} job${prepDone.length>1?'s':''} fully prepped — ${prepDone.map(j=>j.name.split(" — ")[0]).join(", ")}</div>`:""}</div></div>`;
}

/* ───────────────────────── job drawer ───────────────────────── */
const COMM_TABS = ["Job Info","Activity","Photos","Plans & Links","Pre-Con","Change Orders","Open Items"];
function openDrawer(id, tab){ openJob = JOBS.find(j=>j.id===id); openTab = tab||"Job Info"; renderDrawer(); $("#overlay").classList.add("open"); $("#drawer").classList.add("open"); }
function closeDrawer(){ $("#overlay").classList.remove("open"); $("#drawer").classList.remove("open"); openJob=null; }
function renderDrawer(){
  const j = openJob; if(!j) return; const c = precon(j);
  const stage = commStageOf(j);
  let body = "";
  if (openTab==="Job Info") body = `
    <div class="card"><h3>JOB</h3><div class="grid">
      ${[["Job name",j.name],["Address","(from Simpro)"],["GC",j.gc],["Foreman",j.foreman],["Lead","—"],["Simpro Job #",j.simpro]].map(([l,v])=>`<div class="f"><label>${l}</label><input value="${v}"/></div>`).join("")}
    </div></div>
    <div class="card"><h3>DIVISION · STAGE</h3>
      <div style="display:flex;gap:18px;flex-wrap:wrap;align-items:flex-end">
        <div class="f"><label>Division</label><div class="seg"><button data-div="resi">RESI</button><button class="on" data-div="comm">COMMERCIAL</button></div><div class="hint">Admin / manager. Moving a job asks once; nothing is deleted.</div></div>
        <div class="f"><label>Stage</label><div class="seg stage">${STAGES.filter(([k])=>k!=="precon").map(([k,l])=>`<button data-stage="${k}" class="${(stage===k)?'on':''}" ${!commCleared(j)?'disabled':''}>${l.toUpperCase()}</button>`).join("")}</div><div class="hint">${commCleared(j)?"Stamped with a date on change.":"Locked until cleared to mobilize (Pre-Con tab)."}</div></div>
      </div></div>
    <div class="card"><h3>COMMERCIAL</h3><div class="grid">
      ${[["Project #",j.projectNo],["GC PM",j.gcPm],["GC Super",j.gcSuper],["Super phone","801-555-0142"],["Contract value",j.contractValue],["Permit #",j.permitNo||""],["Plan set / rev",j.planSetRev],["Mobilize date",j.mobilize],["Site hours","6:30–3:30, no Sat"],["Badge / orientation","GC orientation Tue 6:15"],["Parking","Lot C, south gate"],["Laydown","Conex behind Bldg B"]].map(([l,v])=>`<div class="f"><label>${l}</label><input value="${v}" placeholder="—"/></div>`).join("")}
    </div></div>
    <div class="card"><h3>JOB SECTIONS · 3 hidden</h3><div class="hint">Same v439 panel. Matterport, Generator, Temp Pedestal off for this job.</div></div>`;
  else if (openTab==="Pre-Con") {
    const done = PRECON_ITEMS.filter(([k])=>c.prep[k]||c.prepNA[k]).length; const ov=c.prepOverride&&c.prepOverride.on;
    body = `<div class="card"><h3>OFFICE ADMIN · JUSTIN</h3><div class="chips">${ADMIN_ITEMS.map(([k,l])=>chip(j,"admin",k,l)).join("")}</div></div>
    <div class="card"><h3>PRE-CON CHECKLIST · KOY <span class="prog" style="margin-left:8px"><b>${done}/${PRECON_ITEMS.length}</b></span></h3><div class="chips">${PRECON_ITEMS.map(([k,l])=>chip(j,"prep",k,l)).join("")}</div>
      <div style="margin-top:12px">${commPrepChecked(j)?`<span class="pill green">CLEARED TO MOBILIZE — all items checked</span>`:ov?`<span class="pill amber">MOBILIZED ON OVERRIDE · ${c.prepOverride.by} ${c.prepOverride.at}</span> <div class="ovnote">${c.prepOverride.note||""}</div><button class="btn" data-undo="${j.id}" style="margin-top:8px">↩ Undo override</button>`:`<span class="pill red">HELD IN PRE-CON</span> <button class="btn amber" data-override="${j.id}" style="margin-left:8px">MOBILIZE WITHOUT FULL PREP</button>`}</div></div>
    <div class="card"><h3>MY DAY</h3><div class="hint">${commPrepChecked(j)?"No open pre-con row.":`"Pre-Con: ${j.name.split(" — ")[0]}" sits on the Head of Commercial's My Day until every item is checked${ov?" (override active)":""}.`}</div></div>`;
  }
  else if (openTab==="Change Orders") body = `<div class="card"><h3>CHANGE ORDERS</h3><div class="hint">The existing CO tracker, unchanged — same pipeline, quote #, photos, Send to Simpro. Phase 2 question: PCO → COR naming + T&amp;M tickets signed by the super.</div></div>`;
  else if (openTab==="Plans & Links") body = `<div class="card"><h3>PLANS &amp; LINKS</h3><div class="grid">${["Plans","Redlines","Spec book","Submittals folder","Drive folder","GC schedule"].map(l=>`<div class="f"><label>${l}</label><input placeholder="paste link…"/></div>`).join("")}</div><div class="hint">Existing component; commercial jobs get Spec book + Submittals folder rows in the registry.</div></div>`;
  else body = `<div class="card"><h3>${openTab.toUpperCase()}</h3><div class="hint">Existing component, as-is. Reads division-neutral fields.</div></div>`;

  $("#drawer").innerHTML = `<div class="dhead"><div class="name">${j.name} <span class="pill teal">COMMERCIAL</span><span class="x" id="dclose">✕ Close</span></div>
    <div class="sub">${j.gc} · Proj ${j.projectNo} · Simpro #${j.simpro} · ${fdot(j.foreman)}</div>
    <div class="dtabs">${COMM_TABS.map(t=>`<div class="dtab ${t===openTab?'on':''}" data-tab="${t}">${t}</div>`).join("")}</div></div>
    <div class="dbody"><div class="note" style="margin-bottom:12px"><b>Commercial job card</b> — 7 tabs (Phase 1). Rough / Finish / Home Runs / Panelized / Tape Light / QC / Return Trips are not in this list, the same way Job Sections drops a tab today.</div>${body}</div>`;
  $("#dclose").onclick = closeDrawer;
  document.querySelectorAll(".dtab").forEach(t => t.onclick = () => { openTab=t.dataset.tab; renderDrawer(); });
  document.querySelectorAll("[data-div]").forEach(b => b.onclick = () => { if(b.dataset.div==="resi") toast(`Move "${j.name.split(" — ")[0]}" to Residential? (confirm) — only \`division\` is written`); });
  document.querySelectorAll("[data-stage]").forEach(b => b.onclick = () => { c.stage=b.dataset.stage; toast(`Stage → ${b.textContent} · stamped ${new Date().toLocaleDateString()}`); renderDrawer(); render(); });
  wire($("#drawer"));
}

/* ───────────────────────── interactions ───────────────────────── */
let pendingOverride = null;
function wire(root){
  root = root || document;
  root.querySelectorAll("[data-open]").forEach(el => el.onclick = () => openDrawer(el.dataset.open, view==="commprep"?"Pre-Con":"Job Info"));
  root.querySelectorAll("[data-chip]").forEach(el => el.onclick = () => {
    const [id,lane,k] = el.dataset.chip.split("|"); const j = JOBS.find(x=>x.id===id); const c=precon(j);
    const map = lane==="admin"?c.admin:c.prep, na = lane==="admin"?c.adminNA:c.prepNA;
    const st = itemState(map,na,k);
    if (st==="todo") { map[k]=true; delete na[k]; }
    else if (st==="done") { delete map[k]; na[k]=true; }
    else { delete map[k]; delete na[k]; }
    render(); if(openJob) renderDrawer();
  });
  root.querySelectorAll("[data-override]").forEach(el => el.onclick = () => {
    const j = JOBS.find(x=>x.id===el.dataset.override); pendingOverride = j; const c=precon(j);
    $("#modalItems").innerHTML = PRECON_ITEMS.filter(([k])=>!c.prep[k]&&!c.prepNA[k]).map(([,l])=>`<li>${l}</li>`).join("");
    $("#modal").classList.add("open");
  });
  root.querySelectorAll("[data-undo]").forEach(el => el.onclick = () => { const j=JOBS.find(x=>x.id===el.dataset.undo); precon(j).prepOverride=null; toast("Override removed — job is held in pre-con again"); render(); if(openJob) renderDrawer(); });
  root.querySelectorAll(".stagehead").forEach(h => h.onclick = () => { const s=h.parentElement; s.classList.toggle("collapsed"); if(s.dataset.stage==="complete") collapsed.stageComplete=s.classList.contains("collapsed"); });
  root.querySelectorAll(".lanehead").forEach(h => h.onclick = () => { const l=h.parentElement; l.classList.toggle("collapsed"); collapsed[l.dataset.lane]=l.classList.contains("collapsed"); });
}
$("#modalCancel").onclick = () => { $("#modal").classList.remove("open"); pendingOverride=null; };
$("#modalOk").onclick = () => { if(pendingOverride){ precon(pendingOverride).prepOverride={on:true,by:"Koy",at:new Date().toLocaleDateString(),note:$("#modal textarea").value}; toast("Cleared to mobilize — items stay owed on the board"); } $("#modal").classList.remove("open"); $("#modal textarea").value=""; pendingOverride=null; render(); if(openJob) renderDrawer(); };
$("#overlay").onclick = closeDrawer;
document.querySelectorAll("#modeswitch button").forEach(b => b.onclick = () => {
  mode = b.dataset.mode;
  if (openJob && (jobDivision(openJob)==="commercial") !== (mode==="comm")) closeDrawer();   // selected job follows the mode
  if (!NAV[mode].some(([k])=>k===view)) view = "home";
  toast(mode==="comm" ? "Switched to Commercial — only commercial jobs everywhere" : "Switched to Residential — today's app, commercial jobs hidden");
  render();
});
render();
</script>
</body>
</html>
