<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Commercial Mode — Mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
  /* ── App tokens (mirrors const C / const D in App.js) ── */
  :root{
    --bg:#EEF0F3; --surface:#F4F6F8; --card:#FFFFFF; --border:#E1E4E9;
    --muted:#CDD3DB; --text:#1B1F24; --dim:#5E6670; --accent:#3B5BA5;
    --blue:#3B5BA5; --green:#3E7D5A; --red:#B23A3A; --purple:#6A5E97;
    --orange:#B06A2C; --teal:#3E7D7A; --amber:#B0892C; --done:#46916A;
    --d-bg1:#141821; --d-bg2:#1B2030; --d-hair:#2A2F3A;
    --d-text:#9AA3B2; --d-bright:#E6EAF1; --d-chipbg:#222732; --d-chipline:#2E3440;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0; background:var(--bg); color:var(--text); font-family:'DM Sans',-apple-system,sans-serif; font-size:14px;}

  /* ── Command header ── */
  .cmdbar{background:linear-gradient(180deg,var(--d-bg1),var(--d-bg2)); border-bottom:1px solid var(--d-hair); padding:10px 18px 12px; position:sticky; top:0; z-index:5;}
  body.comm .cmdbar{border-bottom:2px solid var(--teal);}
  .brandrow{display:flex; align-items:center; gap:12px; flex-wrap:wrap;}
  .brand{font-family:'Bebas Neue',sans-serif; font-size:19px; letter-spacing:0.1em; color:var(--d-bright); display:flex; align-items:center; gap:10px;}
  .brand .mock{font-family:'DM Sans'; font-size:9px; font-weight:700; letter-spacing:0.08em; background:var(--purple); color:#fff; border-radius:99px; padding:2px 8px;}
  .brand .div{font-family:'DM Sans'; font-size:9px; font-weight:800; letter-spacing:0.1em; background:var(--teal); color:#fff; border-radius:4px; padding:2px 7px; display:none;}
  body.comm .brand .div{display:inline-block;}
  .modeswitch{display:flex; border:1px solid var(--d-chipline); border-radius:99px; overflow:hidden; background:var(--d-chipbg); margin-left:auto;}
  .modeswitch button{border:0; background:transparent; color:var(--d-text); font:700 10px 'DM Sans'; letter-spacing:0.1em; padding:6px 12px; cursor:pointer;}
  .modeswitch button.on{background:var(--accent); color:#fff;}
  body.comm .modeswitch button.on{background:var(--teal);}
  .tabs{display:flex; gap:6px; margin-top:8px; overflow-x:auto; scrollbar-width:none;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab{padding:7px 16px; font-size:12px; font-weight:500; color:#9AA3B2; border-radius:8px; letter-spacing:0.02em; white-space:nowrap; cursor:pointer; transition:all 0.15s;}
  .tab.on{background:var(--accent); color:#fff; font-weight:700; box-shadow:0 6px 18px rgba(59,91,165,.5);}
  body.comm .tab.on{background:var(--teal); box-shadow:0 6px 18px rgba(62,125,122,.5);}

  .wrap{padding:16px 18px 80px; max-width:1120px; margin:0 auto;}
  .note{background:#fff; border:1px dashed var(--muted); border-radius:10px; padding:10px 14px; font-size:12px; color:var(--dim); margin-bottom:14px;}
  .note b{color:var(--text);}

  .pagehead{display:flex; align-items:flex-start; justify-content:space-between; flex-wrap:wrap; gap:12px; margin-bottom:14px;}
  .pagehead h1{font-family:'Bebas Neue',sans-serif; font-size:28px; letter-spacing:0.06em; color:var(--text); line-height:1; margin:0; font-weight:400;}
  .subcounts{font-size:12px; color:var(--dim); margin-top:4px;}
  .subcounts b{font-weight:700;}
  .controls{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .controls input[type=text]{padding:6px 10px; border-radius:7px; border:1px solid var(--border); font-size:12px; background:#fff; color:var(--text); font-family:inherit; outline:none; min-width:200px;}
  .btn{padding:6px 12px; border-radius:7px; font-size:12px; border:1px solid var(--border); background:#fff; color:var(--dim); cursor:pointer; font-family:inherit; font-weight:600;}
  .btn.on{background:var(--accent); color:#fff; border-color:var(--accent);}
  .btn.teal{background:var(--teal); color:#fff; border-color:var(--teal);}
  .btn.amber{border-color:var(--amber); color:var(--amber); background:#fff;}
  .btn.sm{padding:3px 8px; font-size:10px;}

  /* ── Sections ── */
  .stage{margin-bottom:18px;}
  .stagehead{display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:2px solid var(--border); margin-bottom:10px; cursor:pointer; flex-wrap:wrap;}
  .stagehead .t{font-family:'Bebas Neue',sans-serif; font-size:17px; letter-spacing:0.08em;}
  .stagehead .n{font-size:11px; font-weight:700; color:var(--dim); background:var(--surface); border:1px solid var(--border); border-radius:99px; padding:1px 8px;}
  .stagehead .who{font-size:10px; font-weight:700; letter-spacing:0.06em; color:var(--dim); text-transform:uppercase;}
  .stagehead .caret{margin-left:auto; color:var(--dim); font-size:11px;}
  .stage.collapsed .rows{display:none;}

  .row{background:var(--card); border:1px solid var(--border); border-radius:10px; padding:12px 14px; margin-bottom:8px; box-shadow:0 4px 16px rgba(15,31,61,0.08); display:flex; align-items:center; gap:14px; flex-wrap:wrap;}
  .row.needs{border-left:3px solid var(--red);}
  .row.ok{border-left:3px solid var(--done);}
  .row.owed{border-left:3px solid var(--amber);}
  .row.cur{border-left:3px solid var(--blue);}
  .jobinfo{min-width:200px; flex:1 1 200px;}
  .jobname{font-weight:700; font-size:14px; color:var(--text); cursor:pointer;}
  .jobname:hover{color:var(--accent); text-decoration:underline;}
  .jobmeta{display:flex; align-items:center; gap:8px; margin-top:3px; font-size:11px; color:var(--dim); flex-wrap:wrap;}
  .fdot{width:7px; height:7px; border-radius:99px; display:inline-block; margin-right:4px;}
  .pill{border-radius:99px; padding:2px 10px; font-size:10px; font-weight:700; white-space:nowrap; letter-spacing:0.05em; border:1px solid transparent;}
  .pill.grey{background:#5E667015; color:var(--dim); border-color:#5E667040;}
  .pill.blue{background:#3B5BA515; color:var(--blue); border-color:#3B5BA540;}
  .pill.teal{background:#3E7D7A15; color:var(--teal); border-color:#3E7D7A40;}
  .pill.green{background:#3E7D5A15; color:var(--green); border-color:#3E7D5A40;}
  .pill.red{background:#B23A3A15; color:var(--red); border-color:#B23A3A40;}
  .pill.amber{background:#B0892C15; color:var(--amber); border-color:#B0892C40;}
  .pill.purple{background:#6A5E9715; color:var(--purple); border-color:#6A5E9740;}
  .pill.gc{background:var(--surface); color:var(--dim); border-color:var(--border); letter-spacing:0;}

  /* ── Job Start card ── */
  .jcard{background:var(--card); border:1px solid var(--border); border-radius:12px; padding:14px 16px; margin-bottom:12px; box-shadow:0 4px 16px rgba(15,31,61,0.08);}
  .jcard.cur{border-left:3px solid var(--blue);}
  .jcard.hasowed{border-left:3px solid var(--amber);}
  .jtop{display:flex; align-items:flex-start; gap:12px; flex-wrap:wrap;}
  .miles{display:flex; gap:6px; flex-wrap:wrap; margin-top:6px;}
  .mile{font-size:10px; font-weight:700; color:var(--dim); background:var(--surface); border:1px solid var(--border); border-radius:6px; padding:2px 7px;}
  .mile b{color:var(--text);}
  .mile.soon b{color:var(--orange);}
  .bar{display:flex; gap:3px; margin:12px 0 4px;}
  .seg{flex:1; height:22px; border-radius:5px; background:var(--muted); color:#fff; font-size:10px; font-weight:800; display:flex; align-items:center; justify-content:center; cursor:pointer; opacity:.55;}
  .seg.done{background:var(--teal); opacity:1;}
  .seg.cur{background:var(--blue); opacity:1; box-shadow:0 0 0 2px #3B5BA540;}
  .seg.owed{background:var(--amber); opacity:1;}
  .seg.peek{outline:2px solid var(--text);}
  .phasehead{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin:10px 0 8px;}
  .phasehead .ph{font-family:'Bebas Neue',sans-serif; font-size:16px; letter-spacing:0.08em; color:var(--blue);}
  .phasehead.past .ph{color:var(--teal);} .phasehead.future .ph{color:var(--dim);}
  .phasehead .own{font-size:10px; font-weight:800; letter-spacing:0.08em; color:var(--dim); text-transform:uppercase; margin-left:auto;}
  .chips{display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
  .chip{display:inline-flex; align-items:center; gap:6px; border-radius:99px; font-size:10px; font-weight:700; letter-spacing:0.05em; cursor:pointer; user-select:none; border:1px solid var(--red); color:var(--red); background:#fff; min-height:30px; padding:0 11px;}
  .chip.done{border-color:var(--done); color:var(--done); background:#46916A0F;}
  .chip.na{border-color:var(--muted); color:var(--dim); border-style:dashed; background:var(--surface);}
  .chip.owedc{border-color:var(--amber); color:var(--amber); background:#B0892C0F;}
  .chip.lock{border-color:var(--muted); color:var(--muted); cursor:default; background:#fff;}
  .chip.trk{border-style:double;}
  .chip .g{font-size:11px;}
  .foot{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-top:10px;}
  .prog{font-size:11px; color:var(--dim); font-weight:600; white-space:nowrap;} .prog b{color:var(--text);}
  .next{font-size:11px; color:var(--orange); font-weight:600;}
  .ovnote{font-size:11px; color:var(--amber); font-weight:600;}
  .strip{border:1px dashed var(--done); border-radius:10px; padding:10px 14px; font-size:12px; color:var(--green); font-weight:600; background:#46916A08;}
  .empty{font-size:12px; color:var(--dim); padding:18px; text-align:center; border:1px dashed var(--muted); border-radius:10px;}

  /* ── Drawer ── */
  .overlay{position:fixed; inset:0; background:rgba(20,24,33,.45); display:none; z-index:20;} .overlay.open{display:block;}
  .drawer{position:fixed; top:0; right:0; bottom:0; width:min(780px,100%); background:var(--bg); z-index:21; transform:translateX(100%); transition:transform .2s; overflow:auto; box-shadow:-12px 0 40px rgba(0,0,0,.25);} .drawer.open{transform:none;}
  .dhead{background:linear-gradient(180deg,var(--d-bg1),var(--d-bg2)); color:var(--d-bright); padding:14px 18px 10px; position:sticky; top:0; z-index:2;}
  .dhead .name{font-family:'Bebas Neue',sans-serif; font-size:24px; letter-spacing:0.05em; display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .dhead .x{margin-left:auto; font:600 12px 'DM Sans'; color:var(--d-text); cursor:pointer; padding:4px 8px;}
  .dhead .sub{font-size:11px; color:var(--d-text); margin-top:2px;}
  .dtabs{display:flex; gap:4px; margin-top:10px; overflow-x:auto; scrollbar-width:none;} .dtabs::-webkit-scrollbar{display:none;}
  .dtab{padding:6px 12px; font-size:11px; font-weight:600; color:var(--d-text); border-radius:7px; white-space:nowrap; cursor:pointer;} .dtab.on{background:var(--teal); color:#fff;}
  .dbody{padding:16px 18px 60px;}
  .card{background:var(--card); border:1px solid var(--border); border-radius:10px; padding:14px 16px; margin-bottom:12px; box-shadow:0 4px 16px rgba(15,31,61,0.06);}
  .card h3{font-family:'Bebas Neue',sans-serif; font-size:16px; letter-spacing:0.08em; margin:0 0 10px; color:var(--dim); font-weight:400;}
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:10px 14px;}
  .f label{display:block; font-size:9px; font-weight:800; letter-spacing:0.1em; color:var(--dim); text-transform:uppercase; margin-bottom:3px;}
  .f input{width:100%; padding:7px 9px; border:1px solid var(--border); border-radius:7px; font:500 13px 'DM Sans'; color:var(--text); background:#fff;}
  .segc{display:inline-flex; border:1px solid var(--border); border-radius:8px; overflow:hidden; flex-wrap:wrap;}
  .segc button{border:0; background:#fff; color:var(--dim); font:700 11px 'DM Sans'; letter-spacing:0.05em; padding:7px 12px; cursor:pointer;}
  .segc button.on{background:var(--teal); color:#fff;}
  .hint{font-size:11px; color:var(--dim); margin-top:6px;}
  table{width:100%; border-collapse:collapse; font-size:11px;}
  th{font-size:9px; letter-spacing:0.08em; text-transform:uppercase; color:var(--dim); text-align:left; padding:6px 6px; border-bottom:1px solid var(--border);}
  td{padding:7px 6px; border-bottom:1px solid var(--surface); vertical-align:top;}
  tr.late td{background:#B23A3A08;}
  .tblwrap{overflow-x:auto;}

  .modal{position:fixed; inset:0; background:rgba(20,24,33,.55); display:none; align-items:center; justify-content:center; z-index:30; padding:16px;} .modal.open{display:flex;}
  .mbox{background:#fff; border-radius:12px; width:min(460px,100%); padding:18px 20px; box-shadow:0 20px 60px rgba(0,0,0,.35);}
  .mbox h2{font-family:'Bebas Neue',sans-serif; font-size:22px; letter-spacing:0.06em; margin:0 0 6px; font-weight:400;}
  .mbox p{font-size:13px; color:var(--dim); margin:0 0 10px;}
  .mbox ul{margin:0 0 12px 18px; padding:0; font-size:13px;}
  .mbox textarea{width:100%; border:1px solid var(--border); border-radius:7px; padding:8px; font:13px 'DM Sans'; min-height:60px; margin-bottom:12px;}
  .mrow{display:flex; gap:8px; justify-content:flex-end;}
  .toast{position:fixed; left:50%; bottom:22px; transform:translateX(-50%); background:var(--d-bg1); color:var(--d-bright); font-size:12px; font-weight:600; padding:9px 14px; border-radius:99px; opacity:0; transition:opacity .2s; pointer-events:none; z-index:40; max-width:92vw; text-align:center;} .toast.show{opacity:1;}
  @media (max-width:520px){ .wrap{padding:12px 12px 80px;} .row,.jcard{padding:10px 12px;} .modeswitch{margin-left:0;} .seg{font-size:9px;} }
</style>
</head>
<body class="comm">

<div class="cmdbar">
  <div class="brandrow">
    <div class="brand">HOMESTEAD ELECTRIC <span class="div">COMMERCIAL</span> <span class="mock">MOCKUP</span></div>
    <div class="modeswitch" id="modeswitch"><button data-mode="resi">RESI</button><button data-mode="comm" class="on">COMMERCIAL</button></div>
  </div>
  <div class="tabs" id="tabs"></div>
</div>

<div class="wrap" id="page"></div>
<div class="overlay" id="overlay"></div>
<div class="drawer" id="drawer"></div>

<div class="modal" id="modal">
  <div class="mbox">
    <h2 id="modalTitle">Move on with items owed?</h2>
    <p>The job moves to the next phase now. These items stay red with an OWED badge inside this phase — and keep their My Day rows — until they're actually checked. Undo any time.</p>
    <ul id="modalItems"></ul>
    <textarea placeholder="Note (optional) — e.g. gear submittal still with the engineer, GC needs us on underground Monday"></textarea>
    <div class="mrow"><button class="btn" id="modalCancel">Cancel</button><button class="btn amber" id="modalOk">Move on</button></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ───────────────────────── registry: Koy's 12-step Job Start Process ───────────────────────── */
// owner: "precon" = comm.precon hat (Brady · Justin), "site" = comm.site hat (Zane · Abe). ALL twelve phases are
// pre-construction (Koy, 2026-09-25) — no phase belongs to the job's foreman; the job mobilizes after phase 12.
// kind: "check" (chip) | "trk" (derived from the Gear & Submittals log) | "photo" (chip + PhotoAttacher) | "date" (chip + date)
const OWNER = { precon:"Brady · Justin", site:"Zane · Abe" };
const PHASES = [
  { n:1,  label:"Quote Approval / Contract Award", owner:"precon", items:[["award","AWARD DOC"],["permitResp","PERMIT RESPONSIBILITY"],["utility","UTILITY / SERVICE COORD"],["contacts","CONTACTS SET"]] },
  { n:2,  label:"Project Setup & Initial Review", owner:"precon", items:[["jobNo","JOB # / COST CODES"],["folders","PROJECT FOLDERS","trk"],["planReview","PLAN / SPEC REVIEW"],["schedule","SCHEDULE + MILESTONES"],["scope","SCOPE BY SYSTEM"]] },
  { n:3,  label:"Request Vendor Submittals", owner:"precon", items:[["ced","CED SENT PLANS/SPECS"],["fa","FA CO. SENT PLANS/SPECS"],["longLead","LONG-LEAD REQUESTED","trk"],["leadTimes","LEAD TIMES + PRICING","trk"]] },
  { n:4,  label:"Electrical Submittal Review", owner:"precon", items:[["pmReview","PM / ESTIMATOR REVIEWED"],["dims","DIMENSIONS / CLEARANCES"],["rfis","RFI LIST","trk"],["toGc","SENT TO GC","trk"],["approved","ALL APPROVED","trk"],["comments","COMMENTS RESOLVED"]] },
  { n:5,  label:"Release / Order Long-Lead Gear", owner:"precon", items:[["released","RELEASED + PO","trk"],["shipDates","SHIP DATES IN WRITING","trk"],["procLog","PROCUREMENT LOG","trk"],["shipMode","SHIP COMPLETE / SPLIT","trk"],["storage","DELIVERY / STORAGE"]] },
  { n:6,  label:"Preconstruction / Site Coordination", owner:"site", items:[["kickoff","GC KICKOFF ATTENDED"],["schedOk","SCHEDULE CONFIRMED"],["manpower","MANPOWER PLAN"],["milestones","MILESTONES SET"],["laydown","LAYDOWN / STORAGE"],["tempNeeds","TEMP POWER NEEDS"],["trailer","TRAILER / CONTAINER"],["crane","CRANE / FORKLIFT"],["rentals","RENTALS + DATES"],["bim","BIM / CLASH"]] },
  { n:7,  label:"Site Work Takeoff & Ordering", owner:"precon", items:[["takeoff","SITE TAKEOFF DONE"],["pvc","PVC / CONDUIT"],["sweeps","SWEEPS / ELBOWS"],["duct","DUCT BANK"],["boxes","PULL BOXES / HANDHOLES"],["ground","GROUNDING"],["siteLt","SITE LIGHTING"],["util","UTILITY / SERVICE CONDUIT"],["vaults","UTILITY VAULTS"],["lvPath","COMM / FA PATHWAYS"],["tape","TAPE / SPACERS / ENCASEMENT"],["ordered","SITE MATERIAL ORDERED"]] },
  { n:8,  label:"Temporary Power", owner:"precon", items:[["req","REQUIREMENTS"],["tempUtil","TEMP UTILITY SERVICE"],["svc","SERVICE / METER / MAIN"],["dist","DISTRIBUTION"],["spider","SPIDER BOXES / GFCI"],["lighting","TEMP LIGHTING"],["trailerPwr","TRAILER POWER"],["cranePwr","CRANE / HOIST POWER"],["energized","INSPECTED + ENERGIZED","date"],["maint","MAINTENANCE OWNER"]] },
  { n:9,  label:"Ufer / Concrete-Encased Electrode", owner:"precon", items:[["footing","FOOTING SCHEDULE REVIEWED"],["config","ELECTRODE CONFIG"],["rebar","CONCRETE / REBAR COORD"],["installed","UFER INSTALLED"],["photos","PHOTOS","photo"],["insp","INSPECTION","date"],["gec","GEC ACCESS CONFIRMED"]] },
  { n:10, label:"Foundation Electrical / Blockouts", owner:"precon", items:[["overlay","DRAWINGS OVERLAID"],["svcCond","SERVICE CONDUITS"],["feeders","FEEDER CONDUITS"],["sleeves","SLEEVES"],["genXfmr","GEN / XFMR CONDUITS"],["siteLt2","SITE LIGHTING"],["lv","LV PATHWAYS"],["ground2","GROUNDING"],["penetr","ROOM PENETRATIONS"],["pads","HOUSEKEEPING PADS"],["blockouts","BLOCKOUTS BEFORE POUR"]] },
  { n:11, label:"Building Underground", owner:"precon", items:[["trades","TRADE OVERLAY"],["layout","LAYOUT DONE"],["banks","BANKS / CROSSINGS FIRST"],["clear","CLEARANCES"],["stubs","STUB-UPS SET + SECURED"],["capped","CAPPED / SEALED"],["strings","PULL STRINGS"],["photos","PHOTOS + DIMENSIONS","photo"],["check","CONDUIT CHECK"],["insp","INSPECTED BEFORE COVER","date"]] },
  { n:12, label:"Slab-on-Grade Coordination", owner:"precon", items:[["floorBoxes","FLOOR BOXES"],["equip","EQUIPMENT FEEDS"],["kitchen","KITCHEN"],["islands","ISLANDS / CASEWORK"],["floorRec","FLOOR RECEPTS"],["mech","MECHANICAL"],["special","SPECIALTY"],["lvSleeves","LV SLEEVES"],["control","DIMS FROM CONTROL LINES"],["prepour","PRE-POUR CHECKLIST / INSP","date"]] },
];
const PHASE = Object.fromEntries(PHASES.map(p=>[p.n,p]));
const PEOPLE = { Gage:"#3B5BA5", Owen:"#6A5E97", Braden:"#3E7D7A", Nelson:"#B06A2C", Zane:"#3E7D5A", Abe:"#6A5E97" };

// helpers to build fake state: allDone(n) marks every item of phases 1..n done
const doneThrough = (n, except=[]) => { const o={}; PHASES.filter(p=>p.n<=n).forEach(p=>p.items.forEach(([k])=>{ const key=p.n+"."+k; if(!except.includes(key)) o[key]={done:true,by:"—",at:"—"}; })); return o; };

const JOBS = [
  { id:"c1", division:"commercial", name:"Ridgeline Dental — TI Suite 210", gc:"Layton Construction", foreman:"Gage", simpro:"1892", projectNo:"LC-24-0311", gcPm:"Dana Whitfield", gcSuper:"Mike Torres", contractValue:"$184,500", permitNo:"", planSetRev:"Rev 2 (9/12)",
    miles:{footing:"10/6/2026",underground:"10/13/2026",slab:"10/20/2026"},
    commercial:{ stage:"", start:{ items:{...doneThrough(2), "3.ced":{done:true}}, na:{}, notes:{}, overrides:{} },
      submittals:[ {item:"Switchgear",vendor:"CED",status:"requested",lead:"22 wk",po:"",ship:"",req:"12/1/2026"}, {item:"Panelboards",vendor:"CED",status:"requested",lead:"8 wk",po:"",ship:"",req:"11/10/2026"}, {item:"Lighting package",vendor:"CED",status:"",lead:"",po:"",ship:"",req:"1/5/2027"}, {item:"Fire alarm",vendor:"FA Co.",status:"",lead:"",po:"",ship:"",req:"1/5/2027"} ] } },
  { id:"c2", division:"commercial", name:"Summit Storage — Bldg B & C", gc:"Big-D Construction", foreman:"Braden", simpro:"1874", projectNo:"BD-7781", gcPm:"Chris Lam", gcSuper:"Andy Ruiz", contractValue:"$412,000", permitNo:"E-26-04412", planSetRev:"IFC 8/2",
    miles:{footing:"8/18/2026",underground:"9/22/2026",slab:"10/2/2026"},
    commercial:{ stage:"", start:{ items:{...doneThrough(10), "11.trades":{done:true}, "11.layout":{done:true}, "11.banks":{done:true}}, na:{"8.cranePwr":true,"10.genXfmr":true}, notes:{11:"Big-D wants the east bank in before the plumber's 4\" main crosses — Thursday."}, overrides:{} },

const jobDivision = j => j.division === "commercial" ? "commercial" : "resi";

/* ───────────────────────── derived rules (mirror spec §6.2) ───────────────────────── */
const st = j => j.commercial.start;
const key = (n,k) => n+"."+k;
const itemState = (j,n,k) => { const s=st(j); const K=key(n,k); return s.items[K]&&s.items[K].done ? "done" : s.na[K] ? "na" : "todo"; };
const phaseChecked = (j,n) => PHASE[n].items.every(([k]) => itemState(j,n,k)!=="todo");
const phaseClosed  = (j,n) => phaseChecked(j,n) || !!st(j).overrides[n];
const commPhase    = j => { for (const p of PHASES) if (!phaseClosed(j,p.n)) return p.n; return null; };   // derived, never stored
const owedItems    = j => PHASES.flatMap(p => st(j).overrides[p.n] ? p.items.filter(([k])=>itemState(j,p.n,k)==="todo").map(([k,l])=>[p.n,k,l]) : []);
const phaseDone    = (j,n) => PHASE[n].items.filter(([k])=>itemState(j,n,k)!=="todo").length;
const ownerOf      = (j,n) => OWNER[PHASE[n].owner];
const gearSummary  = j => { const s=j.commercial.submittals||[]; const appr=s.filter(x=>/approved/.test(x.status)).length; const rel=s.filter(x=>x.po).length; const late=s.filter(x=>x.po&&!x.delivered&&x.ship&&new Date(x.ship)<new Date("2026-09-25")).length; return {n:s.length,appr,rel,late}; };
const boardStage   = j => { const p=commPhase(j); const s=j.commercial.stage; if(s==="hold")return"hold"; if(s==="closeout")return"closeout"; if(s==="complete")return"complete"; if(p!==null) return "precon"; return s==="inprogress" ? "inprogress" : "ready"; };
const STAGES = [["precon","Pre-Con","teal"],["ready","Ready to Start","green"],["inprogress","In Progress","blue"],["hold","On Hold","amber"],["closeout","Closeout","purple"],["complete","Complete","green"]];

/* ───────────────────────── app state ───────────────────────── */
let mode="comm", view="jobstart", openJob=null, openTab="Job Start", peek={};   // peek[jobId] = phase number expanded on the bar
const collapsed = { complete:true };
const NAV = {
  comm:[["myday","My Day"],["home","Job Board"],["needs","Needs"],["cos","COs"],["jobstart","Job Start"],["contractors","Contractors"],["safety","Safety"],["schedule","Forecast"],["settings","Settings"]],
  resi:[["myday","My Day"],["home","Job Board"],["today","Today"],["needs","Needs"],["cos","COs"],["jobprep","Job Prep"],["contractors","Contractors"],["safety","Safety"],["schedule","Forecast"],["huddle","Huddle"],["scoreboard","Scoreboard"],["qc","QC"],["settings","Settings"]] };

const $ = s => document.querySelector(s);
const toast = m => { const t=$("#toast"); t.textContent=m; t.classList.add("show"); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"),2400); };
const fdot = f => `<span class="fdot" style="background:${PEOPLE[f]||'#999'}"></span>${f}`;
const labelOf = k => (NAV.comm.concat(NAV.resi).find(([x])=>x===k)||[k,k])[1];
const soon = d => { const t=(new Date(d)-new Date("2026-09-25"))/864e5; return t>=0 && t<=10; };

function renderTabs(){
  $("#tabs").innerHTML = NAV[mode].map(([k,l]) => `<div class="tab ${view===k?'on':''}" data-view="${k}">${l}</div>`).join("");
  document.querySelectorAll("#tabs .tab").forEach(t => t.onclick = () => { view=t.dataset.view; render(); });
  document.querySelectorAll("#modeswitch button").forEach(b => b.classList.toggle("on", b.dataset.mode===mode));
  document.body.classList.toggle("comm", mode==="comm");
}
function render(){
  renderTabs();
  const jobs = JOBS.filter(j => jobDivision(j) === (mode==="comm"?"commercial":"resi"));   // THE filter — once, at the top
  const p = $("#page");
  if (mode==="resi") { p.innerHTML = view==="home" ? resiBoard(jobs) : `<div class="empty">Residential ${labelOf(view)} — unchanged from today. Commercial jobs never appear here.</div>`; return; }
  if (view==="home") p.innerHTML = commBoard(jobs);
  else if (view==="jobstart") p.innerHTML = jobStart(jobs);
  else p.innerHTML = `<div class="empty">${labelOf(view)} in Commercial mode = the same screen you know, showing only the ${jobs.length} commercial jobs (Needs and My Day follow the job they're attached to).</div>`;
  wire();
}

function resiBoard(jobs){
  return `<div class="note"><b>Residential mode</b> — exactly today's Job Board. The 4 commercial jobs are filtered out at the top of the app, so no residential screen, chase, or count ever sees them.</div>

  ${jobs.map(j => `<div class="row"><div class="jobinfo"><div class="jobname">${j.name}</div><div class="jobmeta">${fdot(j.foreman)} · Simpro #${j.simpro} · <span class="pill gc">${j.gc}</span></div></div><span class="pill blue">${j.resiStage.toUpperCase()}</span></div>`).join("")}`;
}

function commBoard(jobs){
  const groups = STAGES.map(([k,l,c]) => [k,l,c, jobs.filter(j=>boardStage(j)===k)]);

    <div class="stagehead"><span class="t" style="color:var(--${c==='grey'?'dim':c})">${l.toUpperCase()}</span><span class="n">${rows.length}</span><span class="caret">▾</span></div>
    <div class="rows">${rows.length ? rows.map(j => { const p=commPhase(j); const owed=owedItems(j).length; return `<div class="row ${p!==null?(owed?'owed':'cur'):'ok'}"><div class="jobinfo"><div class="jobname" data-open="${j.id}">${j.name}</div>
      <div class="jobmeta">${fdot(j.foreman)} · Simpro #${j.simpro} · Proj ${j.projectNo} · <span class="pill gc">${j.gc}</span> · Super: ${j.gcSuper}</div></div>
      ${p!==null?`<span class="pill teal">PHASE ${p} · ${PHASE[p].label.split(" / ")[0].toUpperCase()}</span><span class="prog"><b>${phaseDone(j,p)}/${PHASE[p].items.length}</b></span>`:""}
      ${owed?`<span class="pill amber">${owed} OWED</span>`:""}
      ${boardStage(j)==="ready"?`<span class="pill green">READY TO START · ASSIGN FOREMAN + CREW</span>`:""}${boardStage(j)==="inprogress"?`<span class="pill blue">IN PROGRESS</span>`:""}${boardStage(j)==="closeout"?`<span class="pill purple">CLOSEOUT</span>`:""}
    </div>`; }).join("") : `<div class="empty">No jobs in ${l}</div>`}</div></div>`).join("")}`;

/* ───────────────────────── Job Start board ───────────────────────── */
function chip(j,n,k,label,kind,ctx){
  const s = itemState(j,n,k); const cur = commPhase(j); const isOwed = s==="todo" && !!st(j).overrides[n];
  const locked = cur!==null && n>cur;
  const cls = locked?"lock": isOwed?"owedc": s;
  const g = s==="done"?"✓":s==="na"?"—":"○";
  const kindTag = kind==="trk"?" trk":"";
  const title = kind==="trk"?"derived from the Gear & Submittals log":kind==="photo"?"opens PhotoAttacher":kind==="date"?"check + date":"tap: ○ → ✓ → N/A";
  return `<span class="chip ${cls}${kindTag}" ${locked?"":`data-chip="${j.id}|${n}|${k}|${ctx}"`} title="${title}"><span class="g">${g}</span>${label}${s==="na"?" · N/A":""}${isOwed?" · OWED":""}${kind==="photo"?" · PHOTO":""}</span>`;
}
function phaseBlock(j,n,ctx){
  const cur = commPhase(j); const p = PHASE[n]; const done=phaseDone(j,n); const ov=st(j).overrides[n];
  const kind = cur===null||n<cur ? "past" : n===cur ? "cur" : "future";
  const owedHere = ov ? p.items.filter(([k])=>itemState(j,n,k)==="todo") : [];
  const nxt = p.items.find(([k])=>itemState(j,n,k)==="todo");
  return `<div class="phasehead ${kind}"><span class="ph">PHASE ${n} · ${p.label.toUpperCase()}</span>${kind==="past"?`<span class="pill ${owedHere.length?'amber':'green'}">${owedHere.length?owedHere.length+' OWED':'DONE'}</span>`:kind==="future"?`<span class="pill grey">UP NEXT</span>`:`<span class="pill blue">CURRENT</span>`}<span class="own">${ownerOf(j,n)}</span></div>
    <div class="chips">${p.items.map(([k,l,kd])=>chip(j,n,k,l,kd,ctx)).join("")}</div>
    ${kind==="cur" ? `<div class="foot"><span class="prog"><b>${done}/${p.items.length}</b></span>${nxt?`<span class="next">NEXT: ${nxt[1]}</span>`:""}
      ${st(j).notes[n]?`<span class="hint" style="margin:0">${st(j).notes[n]}</span>`:""}
      <button class="btn amber sm" data-override="${j.id}|${n}" style="margin-left:auto">MOVE ON WITH ITEMS OWED</button></div>` : ""}
    ${ov ? `<div class="foot"><span class="ovnote">Moved on ${ov.at} by ${ov.by}${ov.note?" — "+ov.note:""}</span><button class="btn sm" data-undo="${j.id}|${n}">↩ Undo</button></div>` : ""}`;
}
function jobCard(j, ctx){
  const cur = commPhase(j); const owed = owedItems(j); const g = gearSummary(j); const pk = peek[j.id];
  const segs = PHASES.map(p => { const n=p.n; const cls = cur===null||n<cur ? (st(j).overrides[n]&&!phaseChecked(j,n)?"owed":"done") : n===cur?"cur":""; return `<div class="seg ${cls} ${pk===n?'peek':''}" data-peek="${j.id}|${n}" title="Phase ${n}: ${p.label}">${n}</div>`; }).join("");
  const showPhases = [];
  if (pk && pk!==cur) showPhases.push(pk);
  if (cur!==null) showPhases.push(cur);
  return `<div class="jcard ${owed.length?'hasowed':'cur'}" id="card-${ctx}-${j.id}">
    <div class="jtop"><div class="jobinfo"><div class="jobname" ${ctx==="board"?`data-open="${j.id}"`:""}>${j.name}</div>
      <div class="jobmeta">${fdot(j.foreman)} · <span class="pill gc">${j.gc}</span> · Proj ${j.projectNo}</div>
      <div class="miles">${Object.entries(j.miles).map(([k,v])=>`<span class="mile ${soon(v)?'soon':''}">${k.toUpperCase()} <b>${v}</b></span>`).join("")}</div></div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:flex-start">
        <span class="pill ${g.late?'red':g.n?'teal':'grey'}" title="Gear & Submittals log">GEAR · ${g.appr} approved · ${g.rel} released${g.late?' · '+g.late+' LATE':''}</span>
        ${owed.length?`<span class="pill amber">${owed.length} OWED IN EARLIER PHASES</span>`:""}</div></div>
    <div class="bar">${segs}</div>
    ${cur===null && !pk ? `<div class="strip">✓ All 12 pre-con phases closed — Ready to Start. Assign the foreman + crew; the on-site checklists (Phase 2) take over from here.</div>` : ""}
    ${showPhases.sort((a,b)=>a-b).map(n=>phaseBlock(j,n,ctx)).join("")}
  </div>`;
}
function jobStart(jobs){
  const live = jobs.filter(j => commPhase(j)!==null);
  const past = jobs.filter(j => commPhase(j)===null);
  const owedTotal = live.reduce((a,j)=>a+owedItems(j).length,0);
  const groups = PHASES.map(p => [p, live.filter(j=>commPhase(j)===p.n)]).filter(([,rows])=>rows.length);
  return `<div class="note"><b>Job Start</b> — each of the 12 steps is a <b>phase</b>, all of them pre-construction (Brady · Justin, Zane · Abe on 6 — nothing here is the foreman's). A job is in one phase at a time; its checklist is open on the card. Check the last item and the card rolls into the next phase's section on its own. Tap a number on the bar to look back at a finished phase (owed items stay tappable) or peek ahead. <b>Move on with items owed</b> closes a phase early — the items stay red until checked.</div>
  <div class="pagehead"><div><h1>JOB START</h1><div class="subcounts"><b>${live.length}</b> active · <b style="color:var(--amber)">${owedTotal}</b> items owed in earlier phases · <b style="color:var(--green)">${past.length}</b> ready to start</div></div>
  <div class="controls"><input type="text" placeholder="Search…"/><button class="btn">Mine</button><button class="btn">Show complete</button></div></div>
  ${groups.map(([p,rows]) => `<div class="stage" data-stage="p${p.n}"><div class="stagehead"><span class="t" style="color:var(--${p.owner==='site'?'purple':'teal'})">PHASE ${p.n} · ${p.label.toUpperCase()}</span><span class="n">${rows.length}</span><span class="who">${OWNER[p.owner]||"Foreman"}</span><span class="caret">▾</span></div>
    <div class="rows">${rows.map(j=>jobCard(j,"board")).join("")}</div></div>`).join("")}
  ${past.length?`<div class="strip">✓ ${past.length} job${past.length>1?'s':''} ready to start / on site — ${past.map(j=>j.name.split(" — ")[0]).join(", ")} (Show complete)</div>`:""}`;
}

  else if (openTab==="Change Orders") body = `<div class="card"><h3>CHANGE ORDERS</h3><div class="hint">The existing CO tracker, unchanged — same pipeline, quote #, photos, Send to Simpro. Open question: PCO → COR naming + T&amp;M tickets signed by the super.</div></div>`;
  else if (openTab==="Plans & Links") body = `<div class="card"><h3>DRIVE FOLDER</h3><div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center"><span class="pill green">#${j.simpro} - ${j.name.split(" — ")[0]}</span><span class="hint" style="margin:0">Created at import · <b>22 files pulled from Simpro</b> · 3 already there · re-pulls every Monday through pre-con</span><button class="btn sm" style="margin-left:auto">Pull from Simpro</button></div><div class="hint">Same Drive section and callables as residential — the folder + plan pull just run on their own when the job is imported (the name and Simpro # are complete, so the half-typed-name problem can't happen).</div></div>
    <div class="card"><h3>PLANS &amp; LINKS</h3><div class="grid">${["Plans","Redlines","Spec book","Submittals folder","GC schedule"].map(l=>`<div class="f"><label>${l}</label><input placeholder="paste link…"/></div>`).join("")}</div><div class="hint">Existing component; commercial jobs get Spec book, Submittals folder and GC schedule rows.</div></div>`;
  else body = `<div class="card"><h3>${openTab.toUpperCase()}</h3><div class="hint">Existing component, as-is. Reads division-neutral fields.</div></div>`;

  $("#drawer").innerHTML = `<div class="dhead"><div class="name">${j.name} <span class="pill teal">COMMERCIAL</span>${p!==null?`<span class="pill teal">PHASE ${p}</span>`:""}<span class="x" id="dclose">✕ Close</span></div>
    <div class="sub">${j.gc} · Proj ${j.projectNo} · Simpro #${j.simpro} · ${fdot(j.foreman)}</div>
    <div class="dtabs">${COMM_TABS.map(t=>`<div class="dtab ${t===openTab?'on':''}" data-tab="${t}">${t}</div>`).join("")}</div></div>
    <div class="dbody"><div class="note" style="margin-bottom:12px"><b>Commercial job card</b> — 9 tabs (Phase 1). Rough / Finish / Home Runs / Panelized / Tape Light / QC / Return Trips are not in this list, the same way Job Sections drops a tab today.</div>${body}</div>`;
  $("#dclose").onclick = closeDrawer;
  const D = $("#drawer");
  D.querySelectorAll(".dtab").forEach(t => t.onclick = () => { openTab=t.dataset.tab; renderDrawer(); });
  D.querySelectorAll("[data-div]").forEach(b => b.onclick = () => { if(b.dataset.div==="resi") toast(`Move "${j.name.split(" — ")[0]}" to Residential? (confirm) — only \`division\` is written`); });
  D.querySelectorAll("button[data-stage]").forEach(b => b.onclick = () => { j.commercial.stage = j.commercial.stage===b.dataset.stage ? "" : b.dataset.stage; toast(`Stage → ${j.commercial.stage||"Ready to Start"} · stamped`); renderDrawer(); render(); });
  wire($("#drawer"));
}

/* ───────────────────────── interactions ───────────────────────── */
let pending=null;
function wire(root){
  root = root || document;
  root.querySelectorAll("[data-open]").forEach(el => el.onclick = () => openDrawer(el.dataset.open, view==="home"?"Job Info":"Job Start"));
  root.querySelectorAll("[data-chip]").forEach(el => el.onclick = () => {
    const [id,n,k] = el.dataset.chip.split("|"); const j=JOBS.find(x=>x.id===id); const N=+n; const s=st(j); const K=key(N,k);
    const before = commPhase(j); const state = itemState(j,N,k);
    if (state==="todo") { s.items[K]={done:true,by:"You",at:"now"}; delete s.na[K]; }
    else if (state==="done") { delete s.items[K]; s.na[K]=true; }
    else { delete s.items[K]; delete s.na[K]; }
    const after = commPhase(j);
    if (after!==before) {
      if (after===null) toast(`Phase 12 done — ${j.name.split(" — ")[0]} is Ready to Start: assign the foreman + crew`);
      else if (before===null || after>before) toast(`Phase ${before} done — now in Phase ${after}: ${PHASE[after].label}`);
      else toast(`Unchecked — ${j.name.split(" — ")[0]} is back in Phase ${after}`);
      peek[id]=null;
    }
    render(); if(openJob) renderDrawer();
  });
  root.querySelectorAll("[data-peek]").forEach(el => el.onclick = () => { const [id,n]=el.dataset.peek.split("|"); peek[id] = peek[id]===+n ? null : +n; render(); if(openJob) renderDrawer(); });
  root.querySelectorAll("[data-override]").forEach(el => el.onclick = () => {
    const [id,n]=el.dataset.override.split("|"); const j=JOBS.find(x=>x.id===id); pending={j,n:+n};
    $("#modalTitle").textContent = `Move on from Phase ${n} with items owed?`;
    $("#modalItems").innerHTML = PHASE[+n].items.filter(([k])=>itemState(j,+n,k)==="todo").map(([,l])=>`<li>${l}</li>`).join("") || "<li>(nothing outstanding — just check the last item instead)</li>";
    $("#modal").classList.add("open");
  });
  root.querySelectorAll("[data-undo]").forEach(el => el.onclick = () => { const [id,n]=el.dataset.undo.split("|"); const j=JOBS.find(x=>x.id===id); delete st(j).overrides[+n]; peek[id]=null; toast(`Undo — ${j.name.split(" — ")[0]} is back in Phase ${commPhase(j)}`); render(); if(openJob) renderDrawer(); });
  root.querySelectorAll(".stagehead").forEach(h => h.onclick = () => { const s=h.parentElement; s.classList.toggle("collapsed"); if(s.dataset.stage==="complete") collapsed.complete=s.classList.contains("collapsed"); });
}
$("#modalCancel").onclick = () => { $("#modal").classList.remove("open"); pending=null; };
$("#modalOk").onclick = () => { if(pending){ const {j,n}=pending; st(j).overrides[n]={by:"Brady",at:"9/25/2026",note:$("#modal textarea").value}; peek[j.id]=null; const after=commPhase(j); toast(after===null?`Moved on — Ready to Start, ${owedItems(j).length} item(s) still owed`:`Moved on — now in Phase ${after}: ${PHASE[after].label} · ${owedItems(j).length} item(s) owed`); } $("#modal").classList.remove("open"); $("#modal textarea").value=""; pending=null; render(); if(openJob) renderDrawer(); };
$("#overlay").onclick = closeDrawer;
document.querySelectorAll("#modeswitch button").forEach(b => b.onclick = () => {
  mode=b.dataset.mode;
  if (openJob && (jobDivision(openJob)==="commercial") !== (mode==="comm")) closeDrawer();
  if (!NAV[mode].some(([k])=>k===view)) view="home";
  toast(mode==="comm" ? "Switched to Commercial — only commercial jobs everywhere" : "Switched to Residential — today's app, commercial jobs hidden");
  render();
});
render();
</script>
</body>
</html>
