<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      /* Pinch-to-zoom stays on everywhere (axe audit 2026-10-08). On iPhone/iPad
         only, maximum-scale=1 stops Safari jumping in when a small text box is
         tapped; iOS still lets you pinch-zoom with it set. */
      (function(){var ua=navigator.userAgent||"";if(/iP(hone|od|ad)/.test(ua)||(/Macintosh/.test(ua)&&navigator.maxTouchPoints>1)){var m=document.querySelector('meta[name=viewport]');if(m)m.setAttribute("content","width=device-width, initial-scale=1, maximum-scale=1");}})();
    </script>
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Homestead" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="description" content="Homestead Electric Job Site Dashboard" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700;800&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&family=Rokkitt:wght@700;800&display=swap" rel="stylesheet" />
    <link rel="icon" href="/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icon-512.png" />
    <link rel="manifest" href="/manifest.json" />
<title>Homestead Electric</title>
    <style>
      /* Design pass 2026-10-14: ~240 inline styles in src/App.js use var(--text),
         var(--dim), var(--card), var(--surface), var(--muted), var(--border), left
         over from an old dark theme that no longer defines them. Undefined, a border
         vanished, a modal background went see-through, and fallbacks like
         var(--text,#ddd) drew light grey on white. They now resolve to the light
         palette — a copy of `const C` in src/App.js (keep in step). --muted is text
         here, so it maps to C.faint. The /dashboard page (.odash) sets its own. */
      :root {
        --text: #1B1F24; --dim: #5E6670; --muted: #666E79; --faint: #666E79;
        --card: #FFFFFF; --surface: #F4F6F8; --bg: #EEF0F3; --border: #E1E4E9;
        --accent: #2F5BD9;
      }
      body { margin: 0; background: #FFFFFF; }
      /* Design pass 2026-10-14: the page used to fall back to the browser's serif
         (Times) for anything without its own font, e.g. the More menu. One base
         font for the whole app; headings that set Bebas Neue inline still win. */
      body, button, input, select, textarea { font-family: "DM Sans", system-ui, -apple-system, sans-serif; }
      /* v537: a touch screen gets finger-sized buttons; body text sits at 500 weight so 12-13 px type holds up in sunlight. */
      body { font-weight: 500; }
      @media (pointer: coarse) { button, [role="button"] { min-height: 40px; } }
      /* Design pass 2026-10-14: buttons that set a smaller inline minHeight / a
         close "✕" minWidth use var(--he-tap, <desktop size>). Unset on a mouse
         (the desktop size holds); 40px on a touch screen. */
      @media (pointer: coarse) { :root { --he-tap: 40px; } }
      .he-sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
      * { -webkit-tap-highlight-color: transparent; }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <main>
      <h1 class="he-sr-only">Homestead Electric</h1>
      <div id="root"></div>
    </main>
  </body>
</html>
