<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Homestead Scoreboard</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600&family=Alfa+Slab+One&display=swap" rel="stylesheet">
<style>
/* Homestead Electric scoreboard: light highlighted board with the dark deck band the GC portal uses for the brand. */
:root{
  --bg:#f3f5f7; --bg-2:#e9edf1; --card:#ffffff; --card-2:#f6f8fa; --line:#dde3e9; --line-2:#c9d2db;
  --ink:#131a21; --ink-2:#465463; --ink-3:#6c7a88;
  --accent:#3b5ba5; --accent-ink:#ffffff; --accent-soft:rgba(59,91,165,.11); --accent-glow:rgba(59,91,165,.28);
  --good:#1b7f4a; --good-soft:rgba(27,127,74,.12); --good-glow:rgba(27,127,74,.25);
  --warn:#a66a00; --warn-soft:rgba(166,106,0,.12);
  --bad:#b23a3a; --bad-soft:rgba(178,58,58,.12);
  --early:#6c7a88; --early-soft:rgba(108,122,136,.14);
  --track:#e6ebf0;
  --deck1:#141821; --deck2:#1b2030; --deck-ink:#e6eaf1; --deck-dim:#9aa3b2; --deck-hair:#2a2f3a; --live:#34d17f;
  --shadow:0 1px 2px rgba(15,25,35,.06), 0 8px 24px -18px rgba(15,25,35,.25);
  --r:14px;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --slab:"Alfa Slab One","Rockwell",Georgia,serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
:root[data-theme="dark"]{
  --bg:#0f1318; --bg-2:#141a21; --card:#1a222b; --card-2:#1f2932; --line:#2a3541; --line-2:#354350;
  --ink:#eef2f6; --ink-2:#aab6c3; --ink-3:#7a8794;
  --accent:#66a8ff; --accent-ink:#0b1420; --accent-soft:rgba(102,168,255,.14); --accent-glow:rgba(102,168,255,.35);
  --good:#3dbe7a; --good-soft:rgba(61,190,122,.16); --good-glow:rgba(61,190,122,.3);
  --warn:#e0a526; --warn-soft:rgba(224,165,38,.16);
  --bad:#ef6a55; --bad-soft:rgba(239,106,85,.16);
  --early:#8a93a0; --early-soft:rgba(138,147,160,.16);
  --track:#232d37;
  --shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 8px 24px -16px rgba(0,0,0,.8);
  color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1318; --bg-2:#141a21; --card:#1a222b; --card-2:#1f2932; --line:#2a3541; --line-2:#354350;
  --ink:#eef2f6; --ink-2:#aab6c3; --ink-3:#7a8794;
  --accent:#66a8ff; --accent-ink:#0b1420; --accent-soft:rgba(102,168,255,.14); --accent-glow:rgba(102,168,255,.35);
  --good:#3dbe7a; --good-soft:rgba(61,190,122,.16); --good-glow:rgba(61,190,122,.3); --warn:#e0a526; --warn-soft:rgba(224,165,38,.16);
  --bad:#ef6a55; --bad-soft:rgba(239,106,85,.16); --early:#8a93a0; --early-soft:rgba(138,147,160,.16);
  --track:#232d37; --shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 8px 24px -16px rgba(0,0,0,.8);
  color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.35;
  background-image:radial-gradient(1100px 520px at 50% -160px,var(--accent-soft),transparent 70%);}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.g{color:var(--good)}.y{color:var(--warn)}.r{color:var(--bad)}.gr{color:var(--early)}

/* shell — the deck band */
.deck{background:linear-gradient(180deg,var(--deck1) 0%,var(--deck2) 100%);color:var(--deck-ink);position:relative;overflow:hidden;border-bottom:1px solid var(--deck-hair)}
.deck::before{content:"";position:absolute;inset:0;background:radial-gradient(900px 300px at 20% 120%,rgba(59,91,165,.35),transparent 70%);pointer-events:none}
.deck .wm{position:absolute;right:-40px;top:-30px;width:min(52vw,520px);opacity:.06;pointer-events:none;filter:blur(.2px)}
.deck-in{max-width:1100px;margin:0 auto;padding:18px 16px 14px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;position:relative}
.deck .logo{height:64px;width:auto;flex:none;filter:drop-shadow(0 6px 18px rgba(0,0,0,.45))}
.deck .x{color:var(--deck-dim);font-size:22px;font-weight:300}
.deck .title{display:flex;flex-direction:column;gap:2px;min-width:0}
.deck .title h1{margin:0;font:400 clamp(26px,5vw,40px)/1 var(--slab);letter-spacing:.06em;text-transform:uppercase;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.deck .title .season{font:600 12px var(--display);letter-spacing:.18em;text-transform:uppercase;color:var(--deck-dim);display:flex;gap:10px;align-items:center}
.deck .title .season i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--live);box-shadow:0 0 10px var(--live)}
.deck .title .season .stale{color:#ff8a7a;font-weight:700}
.deck .right{margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;background:rgba(255,255,255,.06);border:1px solid var(--deck-hair);border-radius:999px;padding:3px}
.seg button{padding:7px 14px;border-radius:999px;font:700 14px var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--deck-dim)}
.seg button[aria-selected="true"]{background:#fff;color:var(--deck1)}
.icon-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--deck-hair);background:rgba(255,255,255,.06);display:grid;place-items:center;color:var(--deck-ink);flex:none}
.icon-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.rule-line{height:1px;background:linear-gradient(90deg,transparent,var(--deck-hair) 20%,var(--deck-hair) 80%,transparent)}
@media (max-width:640px){.deck .logo{height:48px}.deck .x{display:none}.deck .right{margin-left:0;width:100%}}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.filters{max-width:1100px;margin:0 auto;padding:10px 16px;display:flex;gap:8px;align-items:center;overflow-x:auto;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters .lbl{flex:none;font:600 12px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.filters .sep{flex:none;width:1px;height:22px;background:var(--line-2);margin:0 2px}
.filters .fresh{margin-left:auto;flex:none;font-size:12px;color:var(--ink-3)}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--ink-2);font-weight:500;display:inline-flex;align-items:center;gap:6px;line-height:1}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip .n{opacity:.75;font-weight:600}
.chip.tg[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px calc(24px + env(safe-area-inset-bottom))}

/* type */
.eyebrow{font:600 12px var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
h2.sect{font:400 20px var(--slab);letter-spacing:.08em;text-transform:uppercase;color:var(--ink);margin:30px 0 12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
h2.sect::before,h2.sect.rules-h::after{content:"";height:2px;width:34px;background:var(--ink);opacity:.8;border-top:1px solid var(--bg);box-shadow:0 3px 0 var(--ink)}
h2.sect .cnt{color:var(--ink-3);font-weight:600;font-size:15px}
h2.sect .why{margin-left:auto;font:500 12px var(--body);letter-spacing:0;text-transform:none;color:var(--ink-3)}
.note{font-size:12px;color:var(--ink-3);margin:8px 2px 0;line-height:1.45}

/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:6px;font-size:12px;font-weight:700;line-height:1.2;white-space:nowrap;font-variant-numeric:tabular-nums}
.pill.g{background:var(--good-soft);color:var(--good)}.pill.y{background:var(--warn-soft);color:var(--warn)}.pill.r{background:var(--bad-soft);color:var(--bad)}.pill.gr{background:var(--early-soft);color:var(--early)}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}
.pill.y i{border-radius:1px;transform:rotate(45deg);width:6px;height:6px}
.pill.r i{border-radius:1px}
.pill.gr i{background:none;border:1.5px solid currentColor;width:6px;height:6px}
.pill.lg{font-size:15px;padding:5px 11px;border-radius:8px}
.tag{display:inline-block;padding:1px 6px;border-radius:4px;font:600 10px var(--display);letter-spacing:.06em;text-transform:uppercase;background:var(--bg-2);color:var(--ink-3);vertical-align:1px}
.spill{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:5px;font:700 11px var(--display);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.spill.ok{background:var(--good-soft);color:var(--good)}.spill.risk{background:var(--bad-soft);color:var(--bad)}

/* podium */
.arena{margin-top:18px;position:relative}
.arena .head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.arena .head .eyebrow{color:var(--accent);font-size:13px}
.arena .head .sub{font-size:13px;color:var(--ink-3)}
.podium{display:grid;gap:12px;align-items:end;grid-template-columns:repeat(var(--cols,3),1fr)}
.pod{position:relative;border-radius:var(--r);border:1px solid var(--line);background:linear-gradient(180deg,var(--card) 0%,var(--card-2) 100%);box-shadow:var(--shadow);padding:16px 14px 14px;display:flex;flex-direction:column;gap:8px;min-width:0;min-height:var(--h,200px);justify-content:flex-end;overflow:hidden;animation:rise .6s cubic-bezier(.2,.7,.2,1) both}
.pod::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,transparent 0 12px,rgba(255,255,255,.012) 12px 13px);pointer-events:none}
.pod.first{border-color:color-mix(in srgb,var(--accent) 55%,var(--line));box-shadow:0 0 0 1px var(--accent-soft),0 0 40px -10px var(--accent-glow),var(--shadow)}
.pod.first .mark{position:absolute;left:50%;bottom:-8%;width:78%;transform:translateX(-50%);opacity:.05;pointer-events:none}
:root[data-theme="dark"] .pod.first .mark,:root:not([data-theme="light"]) .pod.first .mark{opacity:.05}
.pod.first::after{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,transparent,var(--accent),transparent)}
.pod .place{font:800 54px/1 var(--display);letter-spacing:-.02em;color:var(--ink-3);opacity:.35;position:absolute;top:8px;right:12px}
.pod .place.unranked{font-size:16px;letter-spacing:.06em;text-transform:uppercase;opacity:.8;top:14px;text-align:right}
.pod .place.unranked::after{content:"finished · ranks at 4";display:block;font-size:10px;letter-spacing:.1em}
.pod.first .place{color:var(--accent);opacity:.9;text-shadow:0 0 24px var(--accent-glow)}
.pod .team{font:800 22px/1.05 var(--display);letter-spacing:.02em;text-transform:uppercase;padding-right:44px}
.pod .roster{font-size:12px;color:var(--ink-3);line-height:1.35}
.pod .score{font:800 72px/1 var(--display);letter-spacing:-.03em;margin-top:4px}
.pod.first .score{font-size:88px;text-shadow:0 0 26px var(--accent-glow)}
.pod .score small{display:block;font:600 11px var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin-top:4px}
.pod .line{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--ink-2)}
.pod .line b{color:var(--ink);font-weight:600}
.pod.empty{opacity:.55;justify-content:center;text-align:center}
.pod.empty .score{color:var(--early);text-shadow:none}
@media (max-width:640px){.podium{grid-template-columns:1fr !important}.pod{min-height:0 !important}.pod .score,.pod.first .score{font-size:64px}}

/* race to 15 */
.race{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px 16px 12px}
.race .head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.race .head .eyebrow{color:var(--ink-2);font-size:13px}
.lane{display:grid;grid-template-columns:minmax(110px,1.1fr) 5fr auto;gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.lane:first-of-type{border-top:0}
.lane .who{font:700 15px var(--display);letter-spacing:.03em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lane .who small{display:block;font:500 11px var(--body);letter-spacing:0;text-transform:none;color:var(--ink-3)}
.lane .track{position:relative;height:16px;background:var(--track);border-radius:8px;overflow:visible}
.lane .track>i{position:absolute;left:0;top:0;bottom:0;border-radius:8px;transform-origin:left;animation:grow 1.1s cubic-bezier(.2,.7,.2,1) both}
.lane .track>i.g{background:linear-gradient(90deg,color-mix(in srgb,var(--good) 60%,transparent),var(--good));box-shadow:0 0 18px -4px var(--good-glow)}
.lane .track>i.y{background:var(--warn)}.lane .track>i.r{background:var(--bad)}.lane .track>i.gr{background:var(--early)}
.lane .track>i.neg{left:auto;right:calc(100% - var(--zero));width:0}
.lane .goal{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--ink);opacity:.7}
.lane .goal::after{content:"15%";position:absolute;top:-16px;left:-10px;font:700 10px var(--display);letter-spacing:.08em;color:var(--ink-2)}
.lane .v{font:800 20px/1 var(--display);white-space:nowrap;text-align:right;min-width:60px}
.lane.all .who{color:var(--accent)}
@keyframes grow{from{transform:scaleX(0)}}
@media (max-width:520px){.lane{grid-template-columns:minmax(84px,1fr) 4fr auto;gap:8px}.lane .v{font-size:17px;min-width:48px}}

/* this month */
.spot{margin-top:14px;background:linear-gradient(160deg,var(--card) 0%,var(--card-2) 100%);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;position:relative;overflow:hidden}
.spot::before{content:"";position:absolute;inset:-40% -20% auto auto;width:60%;height:120%;background:radial-gradient(closest-side,var(--accent-soft),transparent);pointer-events:none}
.spot .head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;position:relative}
.spot .head .eyebrow{color:var(--accent);font-size:13px}
.mchips{display:flex;gap:6px;flex-wrap:wrap}
.mchips .chip{padding:5px 10px;font-size:12px}
.spot .leader{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;margin-top:10px;position:relative}
.spot .leader .name{font:400 clamp(36px,8vw,64px)/1 var(--slab);letter-spacing:.02em;text-transform:uppercase;color:var(--accent)}
.spot .leader .name small{display:block;font:600 12px var(--display);letter-spacing:.14em;color:var(--ink-3);text-shadow:none;margin-bottom:6px}
.spot .leader .facts{display:grid;gap:4px;font-size:14px;color:var(--ink-2)}
.spot .leader .facts b{color:var(--ink)}
.spotstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 6px;position:relative}
.stat{display:flex;flex-direction:column;gap:2px;padding:10px 12px;background:var(--bg-2);border-radius:12px;border:1px solid var(--line)}
.stat .v{font:800 28px/1 var(--display)}
.stat .eyebrow{font-size:10px}
.stat .hint{font-size:11px;color:var(--ink-3)}
.srow{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:14px;position:relative}
.srow .who{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.srow .who small{display:block;font-size:11px;color:var(--ink-3);font-weight:400}
.srow .n{font-size:12px;color:var(--ink-3);white-space:nowrap}
.srow .tagset{display:inline-flex;gap:6px;align-items:center}
.spot .empty{padding:18px 8px 6px;color:var(--ink-3)}
@media (max-width:640px){.spot .leader{grid-template-columns:1fr}.spotstats{grid-template-columns:1fr 1fr 1fr}.srow{grid-template-columns:1fr auto}.srow .n{display:none}}

/* people */
.teamblock{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.teamblock .th{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.teamblock .th .rank{font:800 26px/1 var(--display);color:var(--ink-3);min-width:34px}
.teamblock.first .th .rank{color:var(--accent)}
.teamblock .th .nm{font:800 20px/1 var(--display);letter-spacing:.03em;text-transform:uppercase}
.teamblock .th .meta{margin-left:auto;display:inline-flex;gap:8px;align-items:center;font-size:12px;color:var(--ink-3);flex-wrap:wrap}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;padding:12px}
.person{background:var(--card-2);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0;text-align:left;position:relative;transition:border-color .15s,transform .15s}
.person:hover{border-color:var(--line-2)}
.person:active{transform:scale(.985)}
.person.lead{border-color:color-mix(in srgb,var(--accent) 50%,var(--line))}
.person .row1{display:flex;align-items:center;gap:10px}
.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font:800 15px var(--display);letter-spacing:.02em;color:#fff;flex:none}
.person .nm{font:700 17px/1.05 var(--display);letter-spacing:.02em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.person .nm small{display:block;font:500 11px var(--body);letter-spacing:0;color:var(--ink-3);margin-top:2px}
.person .sc{margin-left:auto;font:800 30px/1 var(--display);text-align:right}
.person .sc small{display:block;font:600 9px var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.form{display:flex;gap:3px;flex-wrap:wrap}
.form i{width:14px;height:14px;border-radius:3px;background:var(--track);display:inline-block}
.form i.w{background:var(--good);box-shadow:0 0 8px -2px var(--good-glow)}.form i.l{background:var(--bad)}.form i.p{background:none;border:1.5px solid var(--early);opacity:.7}
.form .lbl{font:600 10px var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);width:100%;margin-top:-2px}
.mini{display:grid;gap:5px}
.mini .m{display:grid;grid-template-columns:64px 1fr auto;gap:8px;align-items:center;font-size:12px;color:var(--ink-3)}
.mini .m .b{height:6px;border-radius:3px;background:var(--track);overflow:hidden}
.mini .m .b>i{display:block;height:100%;border-radius:3px;background:var(--accent);transform-origin:left;animation:grow .9s cubic-bezier(.2,.7,.2,1) both}
.mini .m .b>i.g{background:var(--good)}.mini .m .b>i.y{background:var(--warn)}.mini .m .b>i.r{background:var(--bad)}
.mini .m b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums;min-width:44px;text-align:right}
.person.empty{opacity:.6}
.person .open{position:absolute;right:10px;top:10px;color:var(--ink-3);opacity:.6}
.person .open svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* detail sheet */
.detail{margin:0 12px 12px;background:var(--bg-2);border:1px solid var(--line);border-radius:12px;padding:12px;animation:rise .3s cubic-bezier(.2,.7,.2,1) both}
.detail .dh{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.detail .dh .nm{font:800 20px var(--display);letter-spacing:.03em;text-transform:uppercase}
.detail .dh .x{margin-left:auto;color:var(--ink-3);font:600 12px var(--display);letter-spacing:.08em;text-transform:uppercase}
.pstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:0 0 8px}

/* tables */
.tbl-wrap{border:1px solid var(--line);border-radius:10px;overflow:auto;-webkit-overflow-scrolling:touch;margin-top:8px;background:var(--card)}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:13px}
th{position:sticky;top:0;background:var(--card-2);color:var(--ink-3);font:600 11px var(--display);letter-spacing:.08em;text-transform:uppercase;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}

.areset{font:600 12px var(--body);color:var(--ink-3);text-decoration:underline}

    { key: "keegan", name: "Keegan's Team", division: "residential", lead: "Keegan Wilkinson", members: ["Keegan Wilkinson", "Gage Lund", "Austin Schut", "Noah Davis"] },
    { key: "daegan", name: "Daegan's Team", division: "residential", lead: "Daegan Smith",     members: ["Daegan Smith", "Louis Hoffman", "Trever Worley", "Bailey Smith", "Treycen Rollene", "Callen Jakeman"] },

<script>
(function(){

// (Simpro cache + the app's foreman/lead + QC + corrections) and this page shapes them with SB_SHAPE.
const APP_MODE = !window.SB_DATA;

let CAN_SAVE = false;

const pct0 = (v) => Math.round(v) + "%";
const signed0 = (v) => (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(Math.round(v)) + "%";
const dateS = (d) => { if (!d) return DASH; const x = new Date(d + "T12:00:00"); return isNaN(x) ? d : x.toLocaleDateString("en-US", { month: "short", day: "numeric" }); };
const NICK = { "Trever Worley": "Trevor", "James Coleman Christen": "Coleman", "Abraham Tristan": "Abe", "Fonoivasa Mataafa": "Vasa" };
const shortName = (n) => NICK[n] || String(n).split(" ")[0];
const initials = (n) => { const p = String(n || "").trim().split(/\s+/); return p.length > 1 ? (p[0][0] + p[p.length - 1][0]) : (p[0] || "?").slice(0, 2); };
const PAL = ["#3B5BA5", "#46916A", "#B06A2C", "#6A5E97", "#3E7D7A", "#C58A4C", "#3E9E74", "#5B7FC0", "#A5525B"];

const G_DONE = { green: 15, yellow: 10 }, G_ROUGH = { green: 45, yellow: 39 };

const savePend = () => { try { localStorage.setItem("sb2.corr", JSON.stringify(PEND)); } catch {} };
const save = () => {};   // view state is deliberately not remembered — see st above
const WINS = [{ k: "ytd", l: "This year" }, { k: "90", l: "Last 90 days" }, { k: "365", l: "Last 12 months" }];

    green: sc.filter(j => mClass(j.nm) === "g").length, amber: sc.filter(j => mClass(j.nm) === "y").length, red: sc.filter(j => mClass(j.nm) === "r").length,
  };

  const labJobs = sc.filter(j => j.hrs_est > 0); parts.labor = labJobs.length ? labJobs.reduce((a, j) => a + clamp(1 - Math.max(0, j.hrs_act / j.hrs_est * 100 - 100) / 50), 0) / labJobs.length : null;

function render() {
  const teamKeys = new Set(TEAMS.filter(t => t.division === st.division).map(t => t.key));
  const onTeam = (j) => j.teams.some(k => teamKeys.has(k));
  // Everybody counts only jobs that belong to a team (Koy 2026-10-16); off-team people are not shown anywhere.
  const jobs = JOBS().filter(onTeam), all = stats(jobs), prog = PROG().filter(onTeam);
  const teams = TEAMS.filter(t => t.division === st.division).map(t => { const s = stats(forTeam(jobs, t.key)); return { t, s, r: st.score ? scoreOf(s) : null }; }).sort(rankSort);
  const allR = st.score ? scoreOf(all) : null;
  const winLbl = WINS.find(w => w.k === st.win).l.toLowerCase();
  const offTeam = [];
  const known = new Set([...TEAMS.flatMap(t => t.members), ...D.solo, ...D.former, ...D.office]);
  const others = [...new Set([...D.solo.filter(p => !teamOf(p)), ...D.former, ...offTeam.flatMap(j => j.people).filter(p => !known.has(p) || D.office.includes(p))])];
  const nobody = offTeam.filter(j => !j.people.length);
  const stageRows = (filter, G) => {
    const rows = TEAMS.filter(t => t.division === st.division).map(t => ({ name: t.name, js: prog.filter(j => filter(j) && j.teams.includes(t.key)) }));
    const everyone = prog.filter(filter);
    const line = (r) => { const a = r.js.length ? r.js.reduce((s, j) => s + j.nm, 0) / r.js.length : null; return `<div class="srow"><span class="who">${esc(r.name)}</span><span class="n">${r.js.length} job${r.js.length === 1 ? "" : "s"}</span>${a == null ? `<span class="pill gr"><i></i>${DASH}</span>` : mPill(a, G)}</div>`; };
    return rows.map(line).join("") + line({ name: "Everybody", js: everyone });
  };
  const progJobsTable = (filter, G) => jobTable(prog.filter(filter).map(j => ({ ...j, completed: "", gm: null })), G, true);
  const stagePanel = (title, sub, filter, G) => `<div class="panel"><h3>${title} <span>${sub}</span></h3>${stageRows(filter, G)}<details class="dd"><summary>Jobs<span class="cnt">${prog.filter(filter).length}</span></summary><div class="body">${progJobsTable(filter, G)}</div></details></div>`;

  if (D.loading) { mount($("#app"), `<div class="empty" style="padding:40px 16px;text-align:center;color:var(--ink-3)">Loading the scoreboard…</div>`); return; }
  if (!D.jobs.length && !D.prog.length) { mount($("#app"), `<div class="empty" style="padding:40px 16px;text-align:center;color:var(--ink-3)">${D.loadError ? esc(D.loadError) : "No Simpro numbers yet. The nightly pull has not run, or the first pull is still going."}</div>`); return; }
  mount($("#app"), `
  ${st.edit ? pendPanel() : ""}
  <section class="arena stagger">
    <div class="head"><span class="eyebrow">${esc(st.division)} · ${esc(winLbl)} · ${st.score ? "season standings" : "avg net margin"}</span><span class="sub">${all.scored} finished team jobs on the board${allR ? ` · Everybody score <b class="${scoreCls(allR.score)}">${allR.score}</b>` : ""} · Everybody avg ${all.avg == null ? DASH : `<b class="${mClass(all.avg)}">${pct1(all.avg)}</b>`}</span></div>
    ${podium(teams)}
  </section>
  ${race(teams, all)}
  ${spotlight()}

  <h2 class="sect">Teams <span class="cnt">${teams.length}</span><span class="why">tap a name for their jobs</span></h2>
  ${teams.map((x, i) => teamBlock(x, i + 1)).join("")}
  <!-- people not on a team are not shown (Koy 2026-10-16); their finished jobs still count toward Everybody -->

  <h2 class="sect">In progress <span class="cnt">${prog.length} jobs</span><span class="why">context only · never scored</span></h2>
  <div class="stagegrid">
    ${stagePanel("Still in rough", "Rough-In and earlier · 45 / 39", isEarly, G_ROUGH)}
    ${stagePanel("Post-rough", "Rough-In Complete · 45 / 39", isRough, G_ROUGH)}
    ${stagePanel("Finishing", "Finish + Punch List · 15 / 10", isFin, G_DONE)}
  </div>
  <div class="note">Every active Simpro job. A job still in rough is mostly the bid talking; it moves right as Simpro status changes and joins the board once it is complete, 100% invoiced, and costed.</div>

  <h2 class="sect rules-h">How the score works <span class="why">every job is a fight against its own bid · teams rank at ${MIN_RANK_JOBS} finished jobs</span></h2>
  <div class="rules">
    <div class="rule"><div class="pts">70<small>points</small></div><h4>Margin</h4><p>Average net margin on finished jobs, divided by 30. Hit the 15% goal and you earn half the points. Double it and you earn them all.</p></div>
    <div class="rule"><div class="pts">30<small>points</small></div><h4>Beat the bid</h4><p>Share of your finished jobs where the actual net margin met or beat the margin it was bid at. Every job is a win or a loss.</p></div>
    <div class="rule"><div class="pts">—<small>not scored</small></div><h4>Hours, material, QC</h4><p>Shown on every card so you can see them, never scored. A job that hits its margin is a win even if the hours ran over. A team is ranked once it has ${MIN_RANK_JOBS} finished jobs; until then it shows against the goal.</p></div>
  </div>
  <div class="legend">
    <div class="row"><b>Finished jobs</b>${mPill(18)} 15% and up ${mPill(12)} 10 to 15% ${mPill(4)} under 10%</div>
    <div class="row"><b>Still in rough / post-rough</b>${mPill(50, G_ROUGH)} 45% and up ${mPill(41, G_ROUGH)} 39 to 45% ${mPill(30, G_ROUGH)} under 39%</div>
    <div class="row"><b>Form strip</b><span class="form" style="display:inline-flex"><i class="w"></i></span> beat the bid <span class="form" style="display:inline-flex"><i class="l"></i></span> missed it <span class="form" style="display:inline-flex"><i class="p"></i></span> in progress</div>
  </div>
  <details class="dd src"><summary>Where every number comes from</summary><div class="body"><div class="tbl-wrap compact" style="margin-top:10px"><table>
      <tr><td>Which jobs</td><td>Simpro jobs whose <b>Stage</b> is Complete, Invoiced or Archived, <b>InvoicePercentage exactly 100</b> (99.7% is not done), with a <b>CompletedDate</b> inside the season window. A finished job that is not fully invoiced yet is not shown (${NOT_INVOICED().length} waiting right now). In-progress jobs are never pulled into the score.</td></tr>
      <tr><td>Scored when</td><td>Simpro has real costs posted on the job (NettMargin.Actual is not the empty 100% and material, labor or hours are above zero). Otherwise the job is listed grey with the reason.</td></tr>
      <tr><td>Net margin</td><td><b>Totals.NettMargin.Actual</b> per job. Team, person and Everybody headlines are the plain average of their finished jobs.</td></tr>
      <tr><td>Bid margin</td><td><b>Totals.NettMargin.Estimate</b> — the margin the job was bid at. Beat the bid = actual ≥ bid.</td></tr>
      <tr><td>Gross margin</td><td><b>Totals.GrossMargin.Actual</b>, averaged.</td></tr>
      <tr><td>Labor hours vs bid</td><td><b>ResourcesCost.LaborHours</b> Actual ÷ Estimate, summed first, then divided.</td></tr>
      <tr><td>Material vs estimate</td><td><b>MaterialsCost</b> (Actual − Estimate) ÷ Estimate, summed first, shown as a percentage only.</td></tr>
      <tr><td>QC items</td><td>From the app's QC walks, shown on the person detail as information only. Not in the score: it depends on who walked, and the app only saw about half the jobs.</td></tr>
      <tr><td>Who gets credit</td><td>The app's job record: its <b>foreman</b> and <b>lead</b> (matched to Simpro by job number). Falls back to Simpro's Technicians when the app has no record. A job counts for everyone who ran it, once per team.</td></tr>
      <tr><td>Residential / Commercial</td><td>Simpro Business Group (custom field 67) when set; otherwise the Commercial team's jobs count as commercial and everything else as residential.</td></tr>
      <tr><td>Hidden on purpose</td><td>No money at all. Total cost, net profit $, contract $, material $, labor $ and overhead never appear anywhere on this board. Percentages only.</td></tr>
      <tr><td>Small jobs</td><td>Jobs under $2,500 contract (doorbells, timers, service calls) are out by default; the header toggle lets them in.</td></tr>
      <tr><td>Temp peds &amp; extras</td><td>Names matching temp power, temp ped, phase, T&amp;M, EV charger, light change, whip or STC are out of every average unless the header toggle lets them in.</td></tr>
      <tr><td>In progress</td><td>Every job with Simpro Stage = Progress, on the person it belongs to and in the three panels by status. Never scored. Jobs still in Pending stage are not pulled.</td></tr>
    </table></div></div></details>
  `);
  mount($("#foot"), `<div class="in"><img src="/hs-logo-white.png" alt="Homestead Electric"><div><b>Homestead Electric</b><br>Crew scoreboard · finished &amp; fully invoiced jobs only · percentages, never dollars</div><div class="r">Numbers straight from Simpro, read-only<br>Standalone page · not part of the app<br><button class="editlink" data-edit="on">Fix who gets credit</button></div></div>`);
  save();
  countUp();
}
function countUp() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  document.querySelectorAll(".count").forEach(el => {
    const to = Number(el.dataset.to); if (!Number.isFinite(to)) return;
    const small = el.querySelector("small"); const t0 = performance.now(), dur = 900;
    const step = (now) => { const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3); el.replaceChildren(document.createTextNode(String(Math.round(to * e))), small); if (k < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
}

/* events */
document.addEventListener("click", (e) => {
  const tab = e.target.closest("[data-div]"); if (tab) { st.division = tab.dataset.div; st.open = ""; renderTabs(); renderFilters(); render(); return; }
  const win = e.target.closest("[data-win]"); if (win) { st.win = win.dataset.win; renderFilters(); render(); return; }
  const mo = e.target.closest("[data-month]"); if (mo) { st.month = mo.dataset.month; render(); return; }
  const tg = e.target.closest("[data-tg]"); if (tg) { st[tg.dataset.tg] = !st[tg.dataset.tg]; renderFilters(); render(); return; }
  const ed = e.target.closest("[data-edit]"); if (ed) { st.edit = ed.dataset.edit === "on"; if (!st.edit && location.hash === "#edit") history.replaceState(null, "", location.pathname + location.search); render(); if (st.edit) window.scrollTo({ top: 0, behavior: "smooth" }); return; }
  const off = e.target.closest("[data-off]"); if (off) { const j = jobById(Number(off.dataset.off)); if (j) setPending(j.id, j.people.filter(p => p !== off.dataset.name)); return; }
  const rs = e.target.closest("[data-reset],[data-drop]"); if (rs) { delete PEND[Number(rs.dataset.reset || rs.dataset.drop)]; savePend(); render(); return; }
  if (e.target.closest("[data-clear]")) { PEND = {}; savePend(); render(); return; }
  if (e.target.closest("[data-save]")) { postCorrections(mergedCorrections()); const c = $("#copied"); if (c) c.textContent = "Saving…"; return; }
  const ub = e.target.closest("[data-unbake]"); if (ub) { postCorrections((D.corrections || []).filter(c => Number(c.job) !== Number(ub.dataset.unbake))); return; }
  if (e.target.closest("[data-copy]")) { const txt = corrText(); const done = () => { const c = $("#copied"); if (c) c.textContent = "Copied. Paste it to Claude."; }; const fallback = () => { const ta = $("#corrtext"); if (ta) { ta.focus(); ta.select(); } const c = $("#copied"); if (c) c.textContent = "Select the text below and copy it."; };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, fallback); else fallback(); return; }
  const op = e.target.closest("[data-open]"); if (op) { st.open = st.open === op.dataset.open ? "" : op.dataset.open; render(); const d = document.querySelector(".detail"); if (d && st.open) d.scrollIntoView({ block: "nearest", behavior: "smooth" }); return; }
});
document.addEventListener("change", (e) => { const sel = e.target.closest("[data-add]"); if (sel && sel.value) { const j = jobById(Number(sel.dataset.add)); if (j) setPending(j.id, [...j.people, sel.value]); } });
window.addEventListener("hashchange", () => { if (location.hash === "#edit" && !st.edit) { st.edit = true; render(); } });
$("#theme").addEventListener("click", () => {
  const cur = document.documentElement.getAttribute("data-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  document.documentElement.setAttribute("data-theme", cur === "dark" ? "light" : "dark");
});
/* ── app mode: data from the parent tab, corrections back to it ───────────── */
function mergedCorrections() {
  const byJob = {}; (D.corrections || []).forEach(c => { byJob[Number(c.job)] = { job: Number(c.job), name: c.name || "", set: Array.isArray(c.set) ? c.set : [], note: c.note || "" }; });
  Object.entries(PEND).forEach(([id, p]) => { byJob[Number(id)] = { job: Number(id), name: p.name || "", set: p.set || [], note: "Scoreboard edit " + new Date().toISOString().slice(0, 10) }; });
  return Object.values(byJob).sort((a, b) => a.job - b.job);
}
function postCorrections(list) { if (!APP_MODE) return; try { window.parent.postMessage({ type: "sb-corrections", list }, location.origin); } catch {} }
// Once the app has saved, drop pending entries that now match what came back.
function reconcilePending() {
  const baked = {}; (D.corrections || []).forEach(c => { baked[Number(c.job)] = (c.set || []).slice().sort().join("|"); });
  let changed = false;
  Object.keys(PEND).forEach(id => { if (baked[Number(id)] !== undefined && baked[Number(id)] === (PEND[id].set || []).slice().sort().join("|")) { delete PEND[id]; changed = true; } });
  if (changed) savePend();
}
if (APP_MODE) {
  renderTabs(); renderFilters(); render();
  window.addEventListener("message", (e) => {
    if (e.origin !== location.origin || e.source !== window.parent || !e.data || e.data.type !== "sb-data") return;
    const p = e.data.payload || {};
    if (!window.SB_SHAPE) { mount($("#app"), `<div class="empty">This page is missing its rules module.</div>`); return; }
    D = window.SB_SHAPE.shapeScoreboard(p); CAN_SAVE = !!p.canEdit;
    if (p.error) D.loadError = p.error;
    reconcilePending(); renderTabs(); renderFilters(); render();
    const c = $("#copied"); if (c) c.textContent = "";
  });
  try { window.parent.postMessage({ type: "sb-ready" }, location.origin); } catch {}
  // Opened on its own (no app around it): say so instead of loading forever.
  setTimeout(() => { if (D.loading) mount($("#app"), `<div class="empty" style="padding:40px 16px;text-align:center;color:var(--ink-3)">Open this from the app's Scoreboard tab. On its own this page has no numbers to show.</div>`); }, 4000);
} else { renderTabs(); renderFilters(); render(); }
})();
</script>

</html>
